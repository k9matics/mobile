<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K9matics Pro 3D v3.1</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --neon-cyan: #00ffcc;
            --neon-pink: #ff0055;
            --neon-yellow: #ffcc00;
            --text: #c9d1d9;
        }
        body {
            margin: 0; padding: 0; background-color: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; height: 100vh;
        }
        header {
            padding: 12px 20px; background-color: var(--card-bg);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #30363d;
        }
        h1 { margin: 0; font-size: 1.1rem; color: #fff; letter-spacing: 1px; }
        .version { font-size: 0.7em; color: var(--neon-pink); vertical-align: super; }
        .btn {
            background-color: var(--neon-cyan); color: #000; border: none; 
            padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .controls { display: flex; gap: 8px; padding: 12px 20px 0 20px; }
        .btn-measure { background-color: #238636; color: #fff; flex: 1.2; font-size: 0.9rem; padding: 10px; border-radius: 8px; border: none; font-weight: bold; }
        .btn-measure.active { background-color: var(--neon-pink); animation: pulse 1.5s infinite; }
        .btn-measure.review { background-color: #d29922; }
        .btn-action { background-color: #30363d; color: #8b949e; flex: 1; pointer-events: none; border-radius: 8px; border: none; font-weight: bold; font-size: 0.85rem; }
        .btn-action.ready { background-color: #1f6beb; color: #fff; pointer-events: auto; }
        .btn-action.pdf-ready { background-color: #8957e5; color: #fff; pointer-events: auto; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        
        .dashboard { padding: 12px 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .gait-badge {
            align-self: center; background-color: #21262d; border: 1px solid #30363d;
            padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold;
            color: var(--neon-yellow); margin-bottom: 10px; text-transform: uppercase;
        }
        .kpi-container { display: flex; gap: 10px; margin-bottom: 10px; }
        .kpi-box {
            background-color: var(--card-bg); padding: 10px; border-radius: 10px;
            flex: 1; text-align: center; border: 1px solid #30363d;
        }
        .kpi-title { font-size: 0.7rem; color: #8b949e; margin-bottom: 4px; text-transform: uppercase; }
        .kpi-value { font-size: 1.3rem; font-weight: bold; color: var(--neon-cyan); }
        .kpi-value.pink { color: var(--neon-pink); }
        .kpi-value.yellow { color: var(--neon-yellow); }

        #model3D-container { 
            width: 100%; height: 160px; background-color: #0d1117; 
            border: 1px solid #30363d; border-radius: 10px; overflow: hidden;
        }
        #debugRaw { font-size: 0.65rem; color: #8b949e; text-align: center; margin: 4px 0 10px 0; font-family: monospace; }
        
        .chart-container { flex-grow: 1; position: relative; width: 100%; min-height: 120px; }
        
        .gait-distribution { display: none; height: 8px; width: 100%; border-radius: 4px; margin-top: 10px; overflow: hidden; }
        .gait-distribution.show { display: flex; }
        .gait-segment { height: 100%; }
        .gait-schritt { background-color: #3fb950; }
        .gait-trab { background-color: var(--neon-yellow); }
        .gait-galopp { background-color: var(--neon-pink); }
        .gait-ruhe { background-color: #30363d; }
    </style>
</head>
<body>

    <header>
        <h1>K9MATICS <span class="version">v3.1</span></h1>
        <button id="connectBtn" class="btn">Connect</button>
    </header>

    <div class="controls">
        <button id="measureBtn" class="btn btn-measure">Starten</button>
        <button id="exportBtn" class="btn btn-action">CSV</button>
        <button id="pdfBtn" class="btn btn-action">PDF</button>
    </div>

    <div class="dashboard">
        <div class="gait-badge" id="gaitStatus">Status: Nicht verbunden</div>
        
        <div class="kpi-container">
            <div class="kpi-box">
                <div class="kpi-title">Asymmetrie</div>
                <div class="kpi-value" id="valAsym">-- %</div>
            </div>
            <div class="kpi-box">
                <div class="kpi-title">Stoßkraft</div>
                <div class="kpi-value pink" id="valImpact">-- G</div>
            </div>
            <div class="kpi-box">
                <div class="kpi-title">Schritte</div>
                <div class="kpi-value yellow" id="valSteps">0</div>
            </div>
        </div>

        <div id="model3D-container"></div>
        <div id="debugRaw">Warte auf Sensordaten...</div>

        <div class="chart-container">
            <canvas id="mainChart"></canvas>
            <div id="gaitDist" class="gait-distribution"></div>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
        
        let bleDevice;
        const LIVE_BUFFER_SIZE = 100;
        
        let magData = Array(LIVE_BUFFER_SIZE).fill(0);
        let xData = Array(LIVE_BUFFER_SIZE).fill(0);
        let yData = Array(LIVE_BUFFER_SIZE).fill(0);
        let zData = Array(LIVE_BUFFER_SIZE).fill(0);
        let timeData = Array.from({length: LIVE_BUFFER_SIZE}, (_, i) => i);
        let buffer = "";

        let lastX = 0, lastY = 0, lastZ = -1.0;
        let appState = "IDLE"; 
        let recordedMags = [], recordedX = [], recordedY = [], recordedZ = [], recordedGaits = [], recordedSessionCSV = [];
        let recordStartTime = 0;
        let activeGait = "Ruhe";

        // --- 3D SETUP ---
        const container3D = document.getElementById('model3D-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container3D.clientWidth / container3D.clientHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(container3D.clientWidth, container3D.clientHeight);
        container3D.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const sensor3D = new THREE.Group(); 
        const bodyMat = new THREE.MeshPhongMaterial({ color: 0x161b22, flatShading: true });
        const edgeMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, linewidth: 2 });

        function createDogPart(w, h, d, x, y, z, rotX = 0) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, bodyMat);
            const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
            mesh.add(edges);
            mesh.position.set(x, y, z);
            mesh.rotation.x = rotX;
            sensor3D.add(mesh);
        }

        createDogPart(0.6, 0.6, 1.6, 0, 0, 0); 
        createDogPart(0.5, 0.5, 0.5, 0, 0.5, 0.8); 
        createDogPart(0.3, 0.3, 0.4, 0, 0.3, 1.2); 
        createDogPart(0.2, 0.8, 0.2, 0.25, -0.7, 0.6); 
        createDogPart(0.2, 0.8, 0.2, -0.25, -0.7, 0.6); 
        createDogPart(0.2, 0.8, 0.2, 0.25, -0.7, -0.6); 
        createDogPart(0.2, 0.8, 0.2, -0.25, -0.7, -0.6); 
        createDogPart(0.1, 0.6, 0.1, 0, 0.3, -0.9, -Math.PI / 4); 

        scene.add(sensor3D);
        camera.position.set(3.5, 2.5, 4.5);
        camera.lookAt(0, -0.2, 0);

        let filterPitch = 0, filterRoll = 0, filterYaw = 0;
        let lastFilterTime = Date.now();

        function update3DModel(aX, aY, aZ, gX, gY, gZ) {
            const now = Date.now();
            const dt = (now - lastFilterTime) / 1000.0;
            lastFilterTime = now;

            const gxRad = gX * (Math.PI / 180);
            const gyRad = gY * (Math.PI / 180);
            const gzRad = gZ * (Math.PI / 180);

            const accRoll = Math.atan2(aY, Math.sqrt(aX*aX + aZ*aZ));
            const accPitch = Math.atan2(-aX, Math.sqrt(aY*aY + aZ*aZ));

            filterRoll = 0.96 * (filterRoll + gxRad * dt) + 0.04 * accRoll;
            filterPitch = 0.96 * (filterPitch + gyRad * dt) + 0.04 * accPitch;
            filterYaw += gzRad * dt; 

            sensor3D.rotation.set(filterPitch, filterYaw, filterRoll);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container3D.clientWidth / container3D.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container3D.clientWidth, container3D.clientHeight);
            renderer.render(scene, camera);
        });
        renderer.render(scene, camera);

        // --- CHART SETUP ---
        const ctx = document.getElementById('mainChart').getContext('2d');
        const mainChart = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: timeData, 
                datasets: [
                    { label: 'Kraft', data: magData, borderColor: '#00ffcc', borderWidth: 2, pointRadius: 0, fill: true, backgroundColor: 'rgba(0, 255, 204, 0.08)', tension: 0.1 },
                    { label: 'X', data: xData, borderColor: '#ff0055', borderWidth: 1.5, pointRadius: 0, tension: 0.1, fill: false },
                    { label: 'Y', data: yData, borderColor: '#3fb950', borderWidth: 1.5, pointRadius: 0, tension: 0.1, fill: false },
                    { label: 'Z', data: zData, borderColor: '#58a6ff', borderWidth: 1.5, pointRadius: 0, tension: 0.1, fill: false }
                ] 
            },
            options: { 
                responsive: true, maintainAspectRatio: false, animation: false, 
                scales: { x: { display: false }, y: { min: -3, max: 4, grid: { color: '#30363d' }, ticks: { color: '#8b949e' } } }, 
                plugins: { legend: { display: true, labels: { color: '#c9d1d9', boxWidth: 12 } } } 
            }
        });

        function findPeaks(data, height, distance) {
            let peaks = [];
            for (let i = 1; i < data.length - 1; i++) {
                if (data[i] > height && data[i] > data[i - 1] && data[i] > data[i + 1]) {
                    if (peaks.length === 0 || (i - peaks[peaks.length - 1].index) >= distance) { peaks.push({ index: i, value: data[i] }); }
                }
            }
            return peaks;
        }

        function detectGait(peaks, recentAvgMag) {
            if (recentAvgMag < 1.12 && peaks.length === 0) return "Ruhe";
            if (peaks.length === 0) return "Bewegung";
            const meanPeakVal = peaks.reduce((a, b) => a + b.value, 0) / peaks.length;
            if (meanPeakVal > 2.7) return "Galopp";
            if (meanPeakVal >= 1.3 && meanPeakVal <= 2.7) return "Trab";
            return "Schritt";
        }

        async function connectBluetooth() {
            try {
                const btn = document.getElementById('connectBtn');
                btn.innerText = "Suche...";
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "K9matics" }, { services: [SERVICE_UUID] }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(CHAR_UUID);
                
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);
                
                btn.innerText = "Verbunden";
                btn.style.backgroundColor = "#ff0055"; btn.style.color = "#fff";
                document.getElementById('gaitStatus').innerText = "Status: Bereit";
                setInterval(updateDashboard, 100);
            } catch (error) {
                console.error(error);
                document.getElementById('connectBtn').innerText = "Connect";
            }
        }

        function handleData(event) {
            if (appState === "REVIEW") return;
            buffer += new TextDecoder().decode(event.target.value);
            let lines = buffer.split('\n');
            buffer = lines.pop(); 
            const now = Date.now();
            
            for (let line of lines) {
                line = line.trim();
                if(!line) continue;
                
                document.getElementById('debugRaw').innerText = "Raw: " + line;

                const match = line.match(/AX:([-\d\.]+)\s+AY:([-\d\.]+)\s+AZ:([-\d\.]+)\s+GX:([-\d\.]+)\s+GY:([-\d\.]+)\s+GZ:([-\d\.]+)/);
                if (match) {
                    let ax = parseFloat(match[1]), ay = parseFloat(match[2]), az = parseFloat(match[3]);
                    let gx = parseFloat(match[4]), gy = parseFloat(match[5]), gz = parseFloat(match[6]);
                    
                    if (az === 0 && Math.abs(lastZ) > 0.2) az = lastZ;
                    lastZ = az;

                    update3DModel(ax, ay, az, gx, gy, gz);

                    const mag = Math.sqrt(ax*ax + ay*ay + az*az);
                    
                    magData.push(mag); magData.shift();
                    xData.push(ax); xData.shift();
                    yData.push(ay); yData.shift();
                    zData.push(az); zData.shift();

                    if (appState === "MEASURING") {
                        const timestamp = ((now - recordStartTime) / 1000).toFixed(3);
                        recordedMags.push(mag);
                        recordedX.push(ax); recordedY.push(ay); recordedZ.push(az);
                        recordedGaits.push(activeGait);
                        recordedSessionCSV.push(`${timestamp},${ax},${ay},${az},${gx},${gy},${gz},${mag.toFixed(3)},${activeGait}`);
                    }
                }
            }
        }

        function updateDashboard() {
            if (appState === "REVIEW") return;

            mainChart.data.datasets[0].borderColor = appState === "MEASURING" ? '#ff0055' : '#00ffcc';
            mainChart.data.datasets[0].backgroundColor = appState === "MEASURING" ? 'rgba(255, 0, 85, 0.08)' : 'rgba(0, 255, 204, 0.08)';
            mainChart.update();

            const peaks = findPeaks(magData, 1.25, 7);
            const recentAvg = magData.slice(-20).reduce((a, b) => a + b, 0) / 20;
            activeGait = detectGait(peaks, recentAvg);
            
            document.getElementById('gaitStatus').innerText = appState === "MEASURING" ? `🔴 Aufzeichnung... | ${activeGait}` : `Live: ${activeGait}`;

            if (appState === "MEASURING") {
                const allPeaks = findPeaks(recordedMags, 1.25, 7);
                document.getElementById('valSteps').innerText = allPeaks.length;
                if (allPeaks.length > 0) {
                    const peakVals = allPeaks.map(p => p.value);
                    const meanImpact = peakVals.reduce((a, b) => a + b, 0) / peakVals.length;
                    document.getElementById('valImpact').innerText = meanImpact.toFixed(2) + " G";

                    if (peakVals.length >= 4) {
                        const lefts = peakVals.filter((_, i) => i % 2 === 0), rights = peakVals.filter((_, i) => i % 2 !== 0);
                        if (lefts.length > 0 && rights.length > 0) {
                            const meanL = lefts.reduce((a, b) => a + b, 0) / lefts.length, meanR = rights.reduce((a, b) => a + b, 0) / rights.length;
                            document.getElementById('valAsym').innerText = (Math.abs(meanL - meanR) / ((meanL + meanR) / 2) * 100).toFixed(1) + "%";
                        }
                    }
                }
            }
        }

        function showReview() {
            mainChart.data.labels = Array.from({length: recordedMags.length}, (_, i) => i);
            mainChart.data.datasets[0].data = recordedMags;
            mainChart.data.datasets[1].data = recordedX;
            mainChart.data.datasets[2].data = recordedY;
            mainChart.data.datasets[3].data = recordedZ;
            
            mainChart.data.datasets[0].borderColor = '#ffcc00';
            mainChart.data.datasets[0].backgroundColor = 'rgba(255, 204, 0, 0.08)';
            mainChart.options.scales.x.display = true;
            mainChart.update();

            let counts = { "Ruhe": 0, "Schritt": 0, "Trab": 0, "Galopp": 0, "Bewegung": 0 };
            recordedGaits.forEach(g => { if(counts[g] !== undefined) counts[g]++; });
            
            const total = recordedGaits.length || 1;
            const distDiv = document.getElementById('gaitDist');
            distDiv.innerHTML = '';
            const colors = { "Schritt": "gait-schritt", "Trab": "gait-trab", "Galopp": "gait-galopp", "Ruhe": "gait-ruhe", "Bewegung": "gait-ruhe" };
            
            for (const [gait, count] of Object.entries(counts)) {
                if (count > 0) {
                    const pct = (count / total) * 100;
                    const segment = document.createElement('div');
                    segment.className = `gait-segment ${colors[gait]}`;
                    segment.style.width = `${pct}%`;
                    segment.title = `${gait} (${pct.toFixed(0)}%)`;
                    distDiv.appendChild(segment);
                }
            }
            distDiv.classList.add('show');
            document.getElementById('gaitStatus').innerText = "Zusammenfassung der Messung";
        }

        // --- HIER WAREN DIE BUTTONS VERSCHWUNDEN! ---
        document.getElementById('measureBtn').addEventListener('click', () => {
            const btn = document.getElementById('measureBtn'), exp = document.getElementById('exportBtn'), pdf = document.getElementById('pdfBtn');
            const distDiv = document.getElementById('gaitDist');
            
            if (appState === "IDLE") {
                appState = "MEASURING"; recordStartTime = Date.now();
                recordedSessionCSV = ["Time_Sec,AX,AY,AZ,GX,GY,GZ,Magnitude,Gangart"];
                recordedMags = []; recordedX = []; recordedY = []; recordedZ = []; recordedGaits = []; 
                distDiv.classList.remove('show');
                btn.innerText = "Stoppen"; btn.classList.add("active"); btn.classList.remove("review");
                exp.classList.remove("ready"); pdf.classList.remove("pdf-ready");
                document.getElementById('valAsym').innerText = "..."; document.getElementById('valImpact').innerText = "..."; document.getElementById('valSteps').innerText = "0";
            } else if (appState === "MEASURING") {
                appState = "REVIEW"; btn.innerText = "Neue Messung"; btn.classList.remove("active"); btn.classList.add("review");
                if (recordedSessionCSV.length > 1) { exp.classList.add("ready"); pdf.classList.add("pdf-ready"); showReview(); }
            } else if (appState === "REVIEW") {
                appState = "IDLE"; btn.innerText = "Starten"; btn.classList.remove("review");
                exp.classList.remove("ready"); pdf.classList.remove("pdf-ready"); distDiv.classList.remove('show');
                
                mainChart.data.labels = timeData; 
                mainChart.data.datasets[0].data = magData; 
                mainChart.data.datasets[1].data = xData;
                mainChart.data.datasets[2].data = yData;
                mainChart.data.datasets[3].data = zData;
                
                mainChart.options.scales.x.display = false; mainChart.update();
                document.getElementById('valAsym').innerText = "-- %"; document.getElementById('valImpact').innerText = "-- G"; document.getElementById('valSteps').innerText = "0";
                document.getElementById('gaitStatus').innerText = "Status: Bereit";
            }
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            if (recordedSessionCSV.length <= 1) return;
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([recordedSessionCSV.join("\n")], { type: 'text/csv;charset=utf-8;' }));
            link.download = `k9_lauf_${new Date().toISOString().slice(0,19).replace(/[:T]/g, "-")}.csv`;
            link.click();
        });

        document.getElementById('pdfBtn').addEventListener('click', () => {
            if (appState !== "REVIEW") return;
            const doc = new window.jspdf.jsPDF();
            doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text("K9MATICS PRO - Laufbericht", 14, 20);
            doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.text(`Datum: ${new Date().toLocaleString()}`, 14, 28);
            doc.setDrawColor(200, 200, 200); doc.line(14, 33, 196, 33);
            doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.text("Messwerte:", 14, 43);
            doc.setFont("helvetica", "normal"); doc.setFontSize(11);
            doc.text(`Asymmetrie: ${document.getElementById('valAsym').innerText}`, 14, 52);
            doc.text(`Mittlere Stoßkraft: ${document.getElementById('valImpact').innerText}`, 14, 60);
            doc.text(`Schritte: ${document.getElementById('valSteps').innerText}`, 14, 68);
            doc.addImage(mainChart.toBase64Image(), 'PNG', 14, 78, 182, 90);
            doc.save(`k9_lauf_bericht_${new Date().toISOString().slice(0,19).replace(/[:T]/g, "-")}.pdf`);
        });

        document.getElementById('connectBtn').addEventListener('click', connectBluetooth);
    </script>
</body>
</html>
