<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K9MATICS - Logo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Bebas Neue', sans-serif;
        }

        .logo-container {
            text-align: center;
            color: #ffffff;
        }

        .logo-icon {
            width: 150px;
            height: auto;
            margin-bottom: -10px;
        }

        .logo-title {
            font-size: 3.5rem;
            letter-spacing: 4px;
            margin: 0;
            line-height: 1;
        }

        .logo-subtitle {
            font-size: 1.2rem;
            letter-spacing: 6px;
            color: #aaaaaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <img src="wolf-logo.svg" alt="K9MATICS Wolf" class="logo-icon">
        <h1 class="logo-title">K9MATICS</h1>
        <div class="logo-subtitle">SEIT 2026</div>
    </div>

</body>
</html>
