<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Gait HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="pullRefreshIndicator">Zum Aktualisieren ziehen</div>

  <header>
    <h1>GAIT HUD <span class="version">v1</span></h1>
    <button class="btn btn-calib" id="btnCalib">CALIB</button>
    <button class="btn btn-cam" id="btnCam">CAM</button>
  </header>

  <div class="controls">
    <button class="btn btn-measure" id="btnMeasure">MESSEN</button>
    <button class="btn-action" id="btnSave">SAVE</button>
    <button class="btn-action" id="btnPdf">PDF</button>
  </div>

  <main class="dashboard">
    <div class="gait-badge" id="gaitBadge">STATUS</div>

    <div class="kpi-container">
      <div class="glass-box">
        <div class="kpi-title">SCHRITT</div>
        <div class="kpi-value" id="kpiStep">0</div>
      </div>
      <div class="glass-box">
        <div class="kpi-title">TRAB</div>
        <div class="kpi-value" id="kpiTrab">0</div>
      </div>
      <div class="glass-box">
        <div class="kpi-title">GALOPP</div>
        <div class="kpi-value" id="kpiGalopp">0</div>
      </div>
    </div>

    <section id="hud-radar-container">
      <video id="camFeed" autoplay playsinline muted></video>
      <div class="radar-ring"></div>
      <div class="crosshair-h"></div>
      <div class="crosshair-v"></div>
      <div id="radar-dot"></div>
      <div class="hud-label">HUD ACTIVE</div>
      <div class="hud-coords" id="hudCoords">X:0 Y:0</div>
    </section>

    <p id="debugRaw">READY</p>

    <section class="chart-container">
      <canvas id="gaitChart"></canvas>
      <div class="gait-distribution" id="gaitDistribution">
        <div class="gait-segment gait-schritt" id="segSchritt"></div>
        <div class="gait-segment gait-trab" id="segTrab"></div>
        <div class="gait-segment gait-galopp" id="segGalopp"></div>
        <div class="gait-segment gait-ruhe" id="segRuhe"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
