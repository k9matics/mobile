<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <meta name="theme-color" content="#050709">

  <title>HARNELYZER</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="hud-noise"></div>
  <div class="hud-vignette"></div>
  <div class="hud-grid"></div>

  <div id="pullRefreshIndicator">
    <span id="pullRefreshText">
      ZUM AKTUALISIEREN ZIEHEN
    </span>
  </div>

  <header class="hud-panel hud-header">
    <div class="header-left">
      <div class="hud-corner"></div>

      <h1>
        <span class="title-stack">
          <span id="appName">HARNELYZER</span>
          <span class="title-sub">
            K9 HARNESS MOTION ANALYSIS
          </span>
        </span>

        <span id="appVersion" class="version">
          LÄDT...
        </span>
      </h1>
    </div>

    <div class="header-actions">
      <button id="btnConnect" class="btn btn-connect">
        SENSOR
      </button>

      <button id="btnCalib" class="btn btn-calib">
        CALIB
      </button>
    </div>
  </header>

  <section class="setup-panel">
    <label class="hud-panel">
      HUNDEGRÖSSE

      <select id="dogSize">
        <option value="toy">SEHR KLEIN</option>
        <option value="small">KLEIN</option>
        <option value="medium" selected>MITTEL</option>
        <option value="large">GROSS</option>
        <option value="giant">SEHR GROSS</option>
      </select>
    </label>

    <label class="hud-panel">
      SENSORPOSITION

      <select id="sensorPosition">
        <option value="back" selected>
          RÜCKEN / GESCHIRR
        </option>

        <option value="neck">
          HALSBAND
        </option>

        <option value="pelvis">
          BECKEN / KRUPPE
        </option>

        <option value="leg">
          BEIN
        </option>
      </select>
    </label>
  </section>

  <section class="controls">
    <button id="btnMeasure" class="btn btn-measure">
      MESSUNG STARTEN
    </button>

    <button id="btnDemo" class="btn-action">
      DEMO
    </button>

    <button id="btnSave" class="btn-action">
      CSV
    </button>

    <button id="btnPdf" class="btn-action">
      PDF
    </button>
  </section>

  <main class="dashboard">
    <div id="gaitBadge" class="gait-badge">
      BEREIT
    </div>

    <section class="kpi-container">
      <div class="glass-box hud-cut">
        <div class="kpi-title">GANGART</div>
        <div id="kpiGait" class="kpi-value">—</div>
      </div>

      <div class="glass-box hud-cut">
        <div class="kpi-title">SCHRITTE/MIN</div>
        <div id="kpiCadence" class="kpi-value">0</div>
      </div>

      <div class="glass-box hud-cut">
        <div class="kpi-title">REGELMÄSSIG</div>
        <div id="kpiRegularity" class="kpi-value">0%</div>
      </div>

      <div class="glass-box hud-cut">
        <div class="kpi-title">ASYMMETRIE</div>
        <div id="kpiAsymmetry" class="kpi-value">0%</div>
      </div>
    </section>

    <section id="hudRadar" class="hud-panel hud-cut-large">
      <div class="radar-sweep"></div>
      <div class="radar-ring radar-ring-large"></div>
      <div class="radar-ring radar-ring-mid"></div>
      <div class="radar-ring radar-ring-small"></div>

      <div class="crosshair-h"></div>
      <div class="crosshair-v"></div>

      <div class="radar-bracket radar-bracket-tl"></div>
      <div class="radar-bracket radar-bracket-tr"></div>
      <div class="radar-bracket radar-bracket-bl"></div>
      <div class="radar-bracket radar-bracket-br"></div>

      <div id="radarDot"></div>

      <div class="hud-label">
        HARNESS MOTION FIELD
      </div>

      <div id="hudCoords" class="hud-coords">
        X:0 Y:0
      </div>

      <div id="tiltValue" class="hud-tilt">
        TILT: 0°
      </div>
    </section>

    <section class="chart-container hud-panel hud-cut-large">
      <div class="chart-header">
        <span>LIVE SENSOR GRAPH</span>

        <select id="chartMode">
          <option value="acceleration">
            BESCHLEUNIGUNG
          </option>

          <option value="gyro">
            GYROSKOP
          </option>

          <option value="tilt">
            NEIGUNG
          </option>
        </select>
      </div>

      <canvas id="sensorChart"></canvas>
    </section>

    <section class="analysis-panel hud-panel hud-cut-large">
      <div class="analysis-row">
        <span>BEWEGUNGSINTENSITÄT</span>
        <strong id="motionValue">0.00 g</strong>
      </div>

      <div class="analysis-row">
        <span>NEIGUNG LINKS/RECHTS</span>
        <strong id="rollValue">0.0°</strong>
      </div>

      <div class="analysis-row">
        <span>NEIGUNG VORNE/HINTEN</span>
        <strong id="pitchValue">0.0°</strong>
      </div>

      <div class="analysis-row">
        <span>STATUS</span>
        <strong id="analysisStatus">WARTEN</strong>
      </div>
    </section>

    <p id="debugRaw" class="hud-panel">
      NO DATA
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

  <script src="version.js"></script>
  <script src="analysis.js"></script>
  <script src="storage.js"></script>
  <script src="sensor.js"></script>
  <script src="pdf.js"></script>
  <script src="app.js"></script>
</body>
</html>
