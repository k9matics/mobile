<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>K9matics Pro Blueprint v5.3</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    
    <style>
        :root { 
            --blueprint-bg: #0B192C; 
            --blueprint-card: #1E3E62;
            --blueprint-line: #008DDA;
            --chalk-white: #F3F3E0;
            --chalk-yellow: #FFD0EC;
            --chalk-red: #FF6584;
            --chalk-green: #38E54D;
        }
        * { box-sizing: border-box; touch-action: manipulation; }
        html, body { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; 
            background: var(--blueprint-bg); color: var(--chalk-white); font-family: 'Share Tech Mono', monospace; 
            background-image: linear-gradient(rgba(0, 141, 218, 0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 141, 218, 0.07) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        body { display: flex; flex-direction: column; justify-content: space-between; padding: 4px; }
        
        header { 
            padding: 4px 8px; background: var(--blueprint-card); 
            display: flex; justify-content: space-between; align-items: center; 
            border: 2px dashed var(--blueprint-line); border-radius: 4px; gap: 4px; flex-shrink: 0;
        }
        
        h1 { 
            margin: 0; font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; color: var(--chalk-white); letter-spacing: 1.5px; 
            flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
        }
        .version { font-size: 0.5em; color: var(--chalk-yellow); vertical-align: super; border: 1px solid var(--blueprint-line); padding: 1px 3px; border-radius: 2px; }
        
        .btn { 
            background-color: var(--blueprint-bg); color: var(--chalk-white); border: 1px solid var(--blueprint-line); padding: 4px 8px; border-radius: 4px; 
            font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; cursor: pointer; white-space: nowrap; 
        }
        .btn:active { transform: scale(0.95); background-color: var(--blueprint-line); }
        .btn-calib { background-color: #12213a; border-color: var(--chalk-white); }
        
        .controls { display: flex; gap: 4px; width: 100%; flex-shrink: 0; }
        .btn-measure { 
            background-color: var(--blueprint-line); color: var(--chalk-white); flex: 1.2; font-size: 0.95rem; padding: 6px; border-radius: 4px; 
            border: 1px solid var(--chalk-white); font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; text-align: center;
        }
        .btn-measure.active { background-color: var(--chalk-red); border-color: #fff; animation: pulse 1.5s infinite; }
        .btn-measure.review { background-color: #b8860b; border-color: var(--chalk-yellow); }
        
        .btn-action { 
            background-color: var(--blueprint-card); color: var(--chalk-white); flex: 1; border-radius: 4px; 
            border: 1px solid var(--blueprint-line); font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; padding: 6px 0; text-align: center; 
        }
        .btn-action.ready { background-color: var(--chalk-green); color: #000; border-color: #fff; font-weight: bold; }
        .btn-action.pdf-ready { background-color: #3b5323; color: #fff; border-color: var(--chalk-white); }
        
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
        
        .dashboard { 
            flex-grow: 1; display: flex; flex-direction: column; width: 100%; 
            overflow: hidden; justify-content: space-between; gap: 4px; margin-top: 4px;
        }
        
        .gait-badge { 
            align-self: center; background: var(--blueprint-card); border: 1px dashed var(--chalk-yellow); 
            padding: 2px 10px; border-radius: 4px; font-family: 'Bebas Neue', sans-serif; font-size: 0.85rem; letter-spacing: 1px; 
            color: var(--chalk-yellow); text-transform: uppercase; flex-shrink: 0;
        }
        
        .kpi-container { display: flex; gap: 4px; width: 100%; flex-shrink: 0; }
        .glass-box { 
            background: var(--blueprint-card); border: 1px solid var(--blueprint-line); 
            padding: 4px; border-radius: 4px; flex: 1; text-align: center; min-width: 0; 
        }
        .kpi-title { font-size: 0.45rem; color: var(--chalk-white); margin-bottom: 1px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.8; }
        .kpi-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.15rem; letter-spacing: 1px; color: var(--chalk-white); }
        
        .tuning-panel { 
            display: none; background: var(--blueprint-card); padding: 6px; border-radius: 4px; 
            border: 1px dashed var(--chalk-yellow); width: 100%; flex-shrink: 0;
        }
        .btn-tune { flex: 1; font-family: 'Share Tech Mono', monospace; font-size: 0.7rem; padding: 4px; color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 2px; cursor: pointer; }
        
        #model3D-container { 
            width: 100%; flex-grow: 1.5; background: #060e18; border: 1px solid var(--blueprint-line); border-radius: 4px; 
            overflow: hidden; position: relative; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); min-height: 120px;
        }
        #model3D-container::after {
            content: 'CAD // VIEWPORT'; position: absolute; top: 4px; left: 6px; font-size: 0.5rem; color: var(--blueprint-line); opacity: 0.5; pointer-events: none;
        }
        
        #loader-text { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            color: var(--chalk-yellow); font-family: 'Bebas Neue', sans-serif; font-size: 0.9rem; letter-spacing: 2px; 
        }
        #debugRaw { font-size: 0.5rem; color: var(--chalk-white); text-align: center; margin: 0; font-family: monospace; opacity: 0.5; flex-shrink: 0; }
        
        .chart-container { 
            flex-grow: 2; width: 100%; min-height: 110px; background: #060e18; border: 1px solid var(--blueprint-line); border-radius: 4px; padding: 4px; 
            position: relative; display: flex; flex-direction: column;
        }
        .chart-container canvas { flex-grow: 1; width: 100% !important; height: 100% !important; }
        
        .gait-distribution { display: none; height: 5px; width: 100%; border-radius: 2px; margin-top: 2px; overflow: hidden; flex-shrink: 0; }
        .gait-distribution.show { display: flex; }
        .gait-segment { height: 100%; }
        .gait-schritt { background-color: var(--chalk-green); }
        .gait-trab { background-color: var(--chalk-yellow); }
        .gait-galopp { background-color: var(--chalk-red); }
        .gait-ruhe { background-color: #48485e; }

        /* Pull-to-refresh Indikator Overlay */
        #pullRefreshIndicator {
            position: fixed; top: -50px; left: 0; width: 100%; height: 50px;
            background: var(--blueprint-card); color: var(--chalk-yellow); display: flex;
            align-items: center; justify-content: center; font-size: 0.75rem; border-bottom: 1px dashed var(--blueprint-line);
            transition: transform 0.2s ease; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="pullRefreshIndicator">↓ Zum Aktualisieren nach unten ziehen</div>

    <header>
        <h1>K9MATICS <span class="version">v5.3</span></h1>
        <button id="toggleFullscreenBtn" class="btn" title="Vollbild">⛶</button>
        <button id="toggleTuningBtn" class="btn">PROFIL</button>
        <button id="calibrateBtn" class="btn btn-calib">NULL</button>
        <button id="connectBtn" class="btn" style="border-color: var(--chalk-green); color: var(--chalk-green);">CONNECT</button>
    </header>

    <div class="controls">
        <button id="measureBtn" class="btn btn-measure">STARTEN</button>
        <button id="exportBtn" class="btn btn-action" disabled>CSV</button>
        <button id="pdfBtn" class="btn btn-action" disabled>PDF</button>
    </div>

    <div class="dashboard">
        
        <div class="tuning-panel" id="tuningPanel">
            <div style="font-size: 0.7rem; color: var(--chalk-yellow); margin-bottom: 3px;">KREIDE-PROFIL (START / STOP)</div>
            <div style="display: flex; gap: 4px;">
                <button id="btnLearnWalk" class="btn-tune" style="background:#3fb950;">SCHRITT</button>
                <button id="btnLearnTrot" class="btn-tune" style="background:#1E3E62; border-color: var(--blueprint-line);">TRAB</button>
                <button id="btnLearnGallop" class="btn-tune" style="background:var(--chalk-red);">GALOPP</button>
            </div>
            <div id="tuningStatus" style="font-size: 0.5rem; color: var(--chalk-white); margin-top: 3px; text-align: center; opacity: 0.8;">Profil: Trab > 1.30G | Galopp > 2.70G</div>
        </div>

        <div class="gait-badge" id="gaitStatus">STATUS: GETRENNT</div>
        
        <div class="kpi-container">
            <div class="glass-box">
                <div class="kpi-title">ASYMMETRIE</div>
                <div class="kpi-value" id="valAsym">-- %</div>
            </div>
            <div class="glass-box">
                <div class="kpi-title">STOSSKRAFT</div>
                <div class="kpi-value" id="valImpact" style="color: var(--chalk-red);">-- G</div>
            </div>
            <div class="glass-box">
                <div class="kpi-title">SCHRITTE</div>
                <div class="kpi-value" id="valSteps" style="color: var(--chalk-yellow);">0</div>
            </div>
        </div>

        <div id="model3D-container">
            <div id="loader-text">LADE CAD-DATEN...</div>
        </div>
        <div id="debugRaw">Warte auf Sensordaten...</div>

        <div class="chart-container">
            <canvas id="mainChart"></canvas>
            <div id="gaitDist" class="gait-distribution"></div>
        </div>
    </div>

    <script>
        // --- PULL-TO-REFRESH LOGIK ---
        let touchStartY = 0;
        const indicator = document.getElementById('pullRefreshIndicator');

        window.addEventListener('touchstart', (e) => {
            if (window.scrollY === 0) {
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            const touchY = e.touches[0].clientY;
            const pullDist = touchY - touchStartY;
            if (window.scrollY === 0 && pullDist > 80) {
                indicator.style.transform = "translateY(50px)";
                indicator.innerText = "⟳ Loslassen zum Aktualisieren...";
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].clientY;
            if (window.scrollY === 0 && (touchEndY - touchStartY) > 80) {
                window.location.reload();
            } else {
                indicator.style.transform = "translateY(0)";
            }
        }, { passive: true });

        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
        
        let bleDevice;
        const LIVE_BUFFER_SIZE = 100;
        
        let magData = Array(LIVE_BUFFER_SIZE).fill(0);
        let xData = Array(LIVE_BUFFER_SIZE).fill(0);
        let yData = Array(LIVE_BUFFER_SIZE).fill(0);
        let zData = Array(LIVE_BUFFER_SIZE).fill(0);
        let timeData = Array.from({length: LIVE_BUFFER_SIZE}, (_, i) => i);
        let buffer = "";

        let lastX = 0, lastY = 0, lastZ = -1.0;
        let appState = "IDLE"; 
        let recordedMags = [], recordedX = [], recordedY = [], recordedZ = [], recordedGaits = [], recordedSessionCSV = [];
        let recordStartTime = 0;
        let activeGait = "Ruhe";
        let pitchOffset = 0, rollOffset = 0, yawOffset = 0;

        let valAvgWalk = 1.15, valAvgTrot = 2.00, valAvgGallop = 3.50;
        let threshWalkTrot = 1.30, threshTrotGallop = 2.70;
        let learningBuffer = [], activeLearningGait = "";

        document.getElementById('toggleFullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.error(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        function updateThresholds() {
            threshWalkTrot = valAvgWalk + ((valAvgTrot - valAvgWalk) / 2);
            threshTrotGallop = valAvgTrot + ((valAvgGallop - valAvgTrot) / 2);
            document.getElementById('tuningStatus').innerText = `Profil: Trab > ${threshWalkTrot.toFixed(2)}G | Galopp > ${threshTrotGallop.toFixed(2)}G`;
        }

        document.getElementById('toggleTuningBtn').addEventListener('click', () => {
            const panel = document.getElementById('tuningPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        });

        function handleCalibrationToggle(gaitType, btnId, defaultColor) {
            const btn = document.getElementById(btnId);
            const statusEl = document.getElementById('tuningStatus');

            if (appState === "IDLE") {
                appState = "LEARNING";
                activeLearningGait = gaitType;
                learningBuffer = [];
                btn.innerText = "STOPP";
                btn.style.backgroundColor = "var(--chalk-red)";
                statusEl.innerText = `🔴 Messe ${gaitType}...`;
            } else if (appState === "LEARNING" && activeLearningGait === gaitType) {
                appState = "IDLE";
                btn.innerText = gaitType.toUpperCase();
                btn.style.backgroundColor = defaultColor;
                statusEl.style.color = "var(--chalk-white)";
                
                const peaks = findPeaks(learningBuffer, 1.1, 5);
                if(peaks.length < 3) {
                    statusEl.innerText = "Zu wenige Schritte. Bitte wiederholen!";
                    setTimeout(updateThresholds, 3000);
                    return;
                }
                
                const meanPeak = peaks.reduce((a, b) => a + b.value, 0) / peaks.length;
                if(gaitType === "Schritt") valAvgWalk = meanPeak;
                if(gaitType === "Trab") valAvgTrot = meanPeak;
                if(gaitType === "Galopp") valAvgGallop = meanPeak;
                
                updateThresholds();
            } else {
                alert("Bitte stoppe zuerst die aktuelle Messung.");
            }
        }

        document.getElementById('btnLearnWalk').addEventListener('click', () => handleCalibrationToggle('Schritt', 'btnLearnWalk', '#3fb950'));
        document.getElementById('btnLearnTrot').addEventListener('click', () => handleCalibrationToggle('Trab', 'btnLearnTrot', '#1E3E62'));
        document.getElementById('btnLearnGallop').addEventListener('click', () => handleCalibrationToggle('Galopp', 'btnLearnGallop', '#FF6584'));

        // --- 3D SETUP ---
        const container3D = document.getElementById('model3D-container');
        const scene = new THREE.Scene();
        
        const gridHelper = new THREE.GridHelper(10, 20, 0x008DDA, 0x1E3E62);
        gridHelper.position.y = -1.2;
        scene.add(gridHelper);

        const camera = new THREE.PerspectiveCamera(45, container3D.clientWidth / container3D.clientHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(container3D.clientWidth, container3D.clientHeight);
        container3D.appendChild(renderer.domElement);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x0B192C, 1.2);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const sensor3D = new THREE.Group(); 
        scene.add(sensor3D);

        const loader = new THREE.OBJLoader();
        loader.load('13466_Canaan_Dog_v1_L3.obj', function (object) {
            document.getElementById('loader-text').style.display = 'none';
            
            object.traverse(function (child) {
                if (child.isMesh) {
                    child.material = new THREE.MeshStandardMaterial({ 
                        color: 0xF3F3E0, roughness: 0.4, metalness: 0.1
                    });
                }
            });

            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            object.position.x = -center.x; object.position.y = -center.y; object.position.z = -center.z;

            const wrapper = new THREE.Group();
            wrapper.add(object);
            wrapper.rotation.x = -Math.PI / 2;
            wrapper.scale.set(0.08, 0.08, 0.08); 
            wrapper.position.set(0, -1.0, 0); 
            
            sensor3D.add(wrapper);
        }, undefined, function (error) {
            document.getElementById('loader-text').innerText = "FEHLER: 404 OBJ FEHLT";
            document.getElementById('loader-text').style.color = "var(--chalk-red)";
        });

        camera.position.set(3.5, 2.5, 4.5);
        camera.lookAt(0, -0.2, 0);

        let filterPitch = 0, filterRoll = 0, filterYaw = 0;
        let lastFilterTime = Date.now();

        function update3DModel(aX, aY, aZ, gX, gY, gZ) {
            const now = Date.now();
            const dt = (now - lastFilterTime) / 1000.0;
            lastFilterTime = now;

            const gxRad = gX * (Math.PI / 180); const gyRad = gY * (Math.PI / 180); const gzRad = gZ * (Math.PI / 180);
            const accRoll = Math.atan2(aY, Math.sqrt(aX*aX + aZ*aZ));
            const accPitch = Math.atan2(-aX, Math.sqrt(aY*aY + aZ*aZ));

            filterRoll = 0.96 * (filterRoll + gxRad * dt) + 0.04 * accRoll;
            filterPitch = 0.96 * (filterPitch + gyRad * dt) + 0.04 * accPitch;
            filterYaw += gzRad * dt; 

            sensor3D.rotation.set(filterPitch - pitchOffset, filterYaw - yawOffset, filterRoll - rollOffset);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!container3D) return;
            camera.aspect = container3D.clientWidth / container3D.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container3D.clientWidth, container3D.clientHeight);
            renderer.render(scene, camera);
        });

        document.getElementById('calibrateBtn').addEventListener('click', () => {
            pitchOffset = filterPitch; rollOffset = filterRoll; yawOffset = filterYaw;
            document.getElementById('calibrateBtn').innerText = "OK";
            setTimeout(() => document.getElementById('calibrateBtn').innerText = "NULL", 2000);
        });

        // --- CHART SETUP ---
        const ctx = document.getElementById('mainChart').getContext('2d');
        let gradientIdle = ctx.createLinearGradient(0, 0, 0, 200);
        gradientIdle.addColorStop(0, 'rgba(0, 141, 218, 0.3)'); gradientIdle.addColorStop(1, 'rgba(0, 141, 218, 0.0)');

        let gradientMeas = ctx.createLinearGradient(0, 0, 0, 200);
        gradientMeas.addColorStop(0, 'rgba(255, 101, 132, 0.4)'); gradientMeas.addColorStop(1, 'rgba(255, 101, 132, 0.0)');

        const mainChart = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: timeData, 
                datasets: [
                    { label: 'Kraft', data: magData, borderColor: 'var(--chalk-yellow)', borderWidth: 2, pointRadius: 0, fill: true, backgroundColor: gradientIdle, tension: 0.2 },
                    { label: 'X', data: xData, borderColor: 'var(--chalk-red)', borderWidth: 1, pointRadius: 0, tension: 0.1, fill: false },
                    { label: 'Y', data: yData, borderColor: 'var(--chalk-green)', borderWidth: 1, pointRadius: 0, tension: 0.1, fill: false },
                    { label: 'Z', data: zData, borderColor: 'var(--blueprint-line)', borderWidth: 1, pointRadius: 0, tension: 0.1, fill: false }
                ] 
            },
            options: { 
                responsive: true, maintainAspectRatio: false, animation: false, 
                scales: { 
                    x: { display: false }, 
                    y: { suggestedMin: -1.5, suggestedMax: 2.5, grid: { color: 'rgba(0, 141, 218, 0.15)' }, ticks: { color: 'var(--chalk-white)', font: { size: 9, family: 'Share Tech Mono' } } } 
                }, 
                plugins: { legend: { display: true, labels: { color: 'var(--chalk-white)', boxWidth: 8, font: { size: 9, family: 'Share Tech Mono' } } } } 
            }
        });

        function findPeaks(data, height, distance) {
            let peaks = [];
            for (let i = 1; i < data.length - 1; i++) {
                if (data[i] > height && data[i] > data[i - 1] && data[i] > data[i + 1]) {
                    if (peaks.length === 0 || (i - peaks[peaks.length - 1].index) >= distance) { peaks.push({ index: i, value: data[i] }); }
                }
            }
            return peaks;
        }

        function detectGait(peaks, recentAvgMag) {
            if (recentAvgMag < 1.12 && peaks.length === 0) return "Ruhe";
            if (peaks.length === 0) return "Bewegung";
            const meanPeakVal = peaks.reduce((a, b) => a + b.value, 0) / peaks.length;
            if (meanPeakVal > threshTrotGallop) return "Galopp";
            if (meanPeakVal >= threshWalkTrot && meanPeakVal <= threshTrotGallop) return "Trab";
            return "Schritt";
        }

        async function connectBluetooth() {
            try {
                const btn = document.getElementById('connectBtn'); btn.innerText = "...";
                bleDevice = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: "K9matics" }, { services: [SERVICE_UUID] }], optionalServices: [SERVICE_UUID] });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(CHAR_UUID);
                
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);
                
                btn.innerText = "VERBUNDEN"; btn.style.backgroundColor = "var(--chalk-green)"; btn.style.color = "#000";
                document.getElementById('gaitStatus').innerText = "STATUS: BEREIT";
                setInterval(updateDashboard, 100);
            } catch (error) { document.getElementById('connectBtn').innerText = "CONNECT"; }
        }

        function handleData(event) {
            if (appState === "REVIEW") return;
            buffer += new TextDecoder().decode(event.target.value);
            let lines = buffer.split('\n'); buffer = lines.pop(); const now = Date.now();
            
            for (let line of lines) {
                line = line.trim(); if(!line) continue;
                document.getElementById('debugRaw').innerText = "Raw: " + line;

                let ax = 0, ay = 0, az = 0, gx = 0, gy = 0, gz = 0; let dataFound = false;
                let mX = line.match(/(?:A?X):\s*([-\d\.]+)/i); if(mX) { ax = parseFloat(mX[1]); dataFound = true; }
                let mY = line.match(/(?:A?Y):\s*([-\d\.]+)/i); if(mY) { ay = parseFloat(mY[1]); dataFound = true; }
                let mZ = line.match(/(?:A?Z):\s*([-\d\.]+)/i); if(mZ) { az = parseFloat(mZ[1]); dataFound = true; }
                let mGX = line.match(/GX:\s*([-\d\.]+)/i); if(mGX) { gx = parseFloat(mGX[1]); }
                let mGY = line.match(/GY:\s*([-\d\.]+)/i); if(mGY) { gy = parseFloat(mGY[1]); }
                let mGZ = line.match(/GZ:\s*([-\d\.]+)/i); if(mGZ) { gz = parseFloat(mGZ[1]); }

                if (dataFound) {
                    if (az === 0 && Math.abs(lastZ) > 0.2) az = lastZ; lastZ = az;
                    update3DModel(ax, ay, az, gx, gy, gz);
                    const mag = Math.sqrt(ax*ax + ay*ay + az*az);
                    
                    magData.push(mag); magData.shift(); xData.push(ax); xData.shift(); yData.push(ay); yData.shift(); zData.push(az); zData.shift();

                    if (appState === "LEARNING") { learningBuffer.push(mag); }
                    if (appState === "MEASURING") {
                        const timestamp = ((now - recordStartTime) / 1000).toFixed(3);
                        recordedMags.push(mag); recordedX.push(ax); recordedY.push(ay); recordedZ.push(az); recordedGaits.push(activeGait);
                        recordedSessionCSV.push(`${timestamp},${ax},${ay},${az},${gx},${gy},${gz},${mag.toFixed(3)},${activeGait}`);
                    }
                }
            }
        }

        function updateDashboard() {
            if (appState === "REVIEW" || appState === "LEARNING") return;
            
            mainChart.data.datasets[0].borderColor = appState === "MEASURING" ? 'var(--chalk-red)' : 'var(--chalk-yellow)';
            mainChart.data.datasets[0].backgroundColor = appState === "MEASURING" ? gradientMeas : gradientIdle;
            mainChart.update();

            const recentData = magData.slice(-35); const livePeaks = findPeaks(recentData, 1.25, 5); 
            const recentAvg = magData.slice(-10).reduce((a, b) => a + b, 0) / 10; 
            
            activeGait = detectGait(livePeaks, recentAvg);
            document.getElementById('gaitStatus').innerText = appState === "MEASURING" ? `🔴 AUFZEICHNUNG... | ${activeGait.toUpperCase()}` : `LIVE: ${activeGait.toUpperCase()}`;

            if (appState === "MEASURING") {
                const allPeaks = findPeaks(recordedMags, 1.25, 7);
                document.getElementById('valSteps').innerText = allPeaks.length;
                if (allPeaks.length > 0) {
                    const peakVals = allPeaks.map(p => p.value);
                    const meanImpact = peakVals.reduce((a, b) => a + b, 0) / peakVals.length;
                    document.getElementById('valImpact').innerText = meanImpact.toFixed(2) + " G";
                    
                    if (peakVals.length >= 4) {
                        const lefts = peakVals.filter((_, i) => i % 2 === 0), rights = peakVals.filter((_, i) => i % 2 !== 0);
                        if (lefts.length > 0 && rights.length > 0) {
                            const meanL = lefts.reduce((a, b) => a + b, 0) / lefts.length, meanR = rights.reduce((a, b) => a + b, 0) / rights.length;
                            const asymCalc = (Math.abs(meanL - meanR) / ((meanL + meanR) / 2) * 100).toFixed(1);
                            
                            const asymEl = document.getElementById('valAsym');
                            asymEl.innerText = asymCalc + " %";
                            
                            if (parseFloat(asymCalc) > 15) {
                                asymEl.style.color = "var(--chalk-red)";
                            } else {
                                asymEl.style.color = "var(--chalk-green)";
                            }
                        }
                    }
                }
            }
        }

        function showReview() {
            mainChart.data.labels = Array.from({length: recordedMags.length}, (_, i) => i);
            mainChart.data.datasets[0].data = recordedMags; mainChart.data.datasets[1].data = recordedX; mainChart.data.datasets[2].data = recordedY; mainChart.data.datasets[3].data = recordedZ;
            mainChart.data.datasets[0].borderColor = 'var(--chalk-yellow)';
            let gradientRev = ctx.createLinearGradient(0, 0, 0, 200);
            gradientRev.addColorStop(0, 'rgba(255, 208, 236, 0.3)'); gradientRev.addColorStop(1, 'rgba(255, 208, 236, 0.0)');
            mainChart.data.datasets[0].backgroundColor = gradientRev;
            mainChart.options.scales.x.display = true; mainChart.update();
            
            let counts = { "Ruhe": 0, "Schritt": 0, "Trab": 0, "Galopp": 0, "Bewegung": 0 };
            recordedGaits.forEach(g => { if(counts[g] !== undefined) counts[g]++; });
            const total = recordedGaits.length || 1; const distDiv = document.getElementById('gaitDist'); distDiv.innerHTML = '';
            const colors = { "Schritt": "gait-schritt", "Trab": "gait-trab", "Galopp": "gait-galopp", "Ruhe": "gait-ruhe", "Bewegung": "gait-ruhe" };
            for (const [gait, count] of Object.entries(counts)) {
                if (count > 0) {
                    const pct = (count / total) * 100; const segment = document.createElement('div');
                    segment.className = `gait-segment ${colors[gait]}`; segment.style.width = `${pct}%`; segment.title = `${gait} (${pct.toFixed(0)}%)`;
                    distDiv.appendChild(segment);
                }
            }
            distDiv.classList.add('show'); document.getElementById('gaitStatus').innerText = "ZUSAMMENFASSUNG DER MESSUNG";
        }

        document.getElementById('measureBtn').addEventListener('click', () => {
            const btn = document.getElementById('measureBtn'), exp = document.getElementById('exportBtn'), pdf = document.getElementById('pdfBtn');
            const distDiv = document.getElementById('gaitDist');
            if (appState === "IDLE") {
                appState = "MEASURING"; recordStartTime = Date.now();
                recordedSessionCSV = ["Time_Sec,AX,AY,AZ,GX,GY,GZ,Magnitude,Gangart"];
                recordedMags = []; recordedX = []; recordedY = []; recordedZ = []; recordedGaits = []; 
                distDiv.classList.remove('show');
                btn.innerText = "STOPPEN"; btn.classList.add("active"); btn.classList.remove("review");
                exp.disabled = true; pdf.disabled = true; exp.classList.remove("ready"); pdf.classList.remove("pdf-ready");
                document.getElementById('valAsym').innerText = "..."; document.getElementById('valImpact').innerText = "..."; document.getElementById('valSteps').innerText = "0";
            } else if (appState === "MEASURING") {
                appState = "REVIEW"; btn.innerText = "NEUE MESSUNG"; btn.classList.remove("active"); btn.classList.add("review");
                if (recordedSessionCSV.length > 1) { exp.disabled = false; pdf.disabled = false; exp.classList.add("ready"); pdf.classList.add("pdf-ready"); showReview(); }
            } else if (appState === "REVIEW") {
                appState = "IDLE"; btn.innerText = "STARTEN"; btn.classList.remove("review");
                exp.disabled = true; pdf.disabled = true; exp.classList.remove("ready"); pdf.classList.remove("pdf-ready"); distDiv.classList.remove('show');
                mainChart.data.labels = timeData; mainChart.data.datasets[0].data = magData; 
                mainChart.data.datasets[1].data = xData; mainChart.data.datasets[2].data = yData; mainChart.data.datasets[3].data = zData;
                mainChart.options.scales.x.display = false; mainChart.update();
                document.getElementById('valAsym').innerText = "-- %"; document.getElementById('valImpact').innerText = "-- G"; document.getElementById('valSteps').innerText = "0";
                document.getElementById('gaitStatus').innerText = "STATUS: BEREIT";
            }
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            if (recordedSessionCSV.length <= 1) return;
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([recordedSessionCSV.join("\n")], { type: 'text/csv;charset=utf-8;' }));
            link.download = `k9_lauf_${new Date().toISOString().slice(0,19).replace(/[:T]/g, "-")}.csv`;
            link.click();
        });

        document.getElementById('pdfBtn').addEventListener('click', () => {
            if (appState !== "REVIEW") return;
            const doc = new window.jspdf.jsPDF();
            doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text("K9MATICS PRO - Laufbericht", 14, 20);
            doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.text(`Datum: ${new Date().toLocaleString()}`, 14, 28);
            doc.setDrawColor(200, 200, 200); doc.line(14, 33, 196, 33);
            doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.text("Messwerte:", 14, 43);
            doc.setFont("helvetica", "normal"); doc.setFontSize(11);
            doc.text(`Asymmetrie: ${document.getElementById('valAsym').innerText}`, 14, 52);
            doc.text(`Mittlere Stoßkraft: ${document.getElementById('valImpact').innerText}`, 14, 60);
            doc.text(`Schritte: ${document.getElementById('valSteps').innerText}`, 14, 68);
            doc.addImage(mainChart.toBase64Image(), 'PNG', 14, 78, 182, 90);
            doc.save(`k9_lauf_bericht_${new Date().toISOString().slice(0,19).replace(/[:T]/g, "-")}.pdf`);
        });

        document.getElementById('connectBtn').addEventListener('click', connectBluetooth);
    </script>
</body>
</html>
