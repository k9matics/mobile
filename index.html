<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K9matics Mobile Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --neon-cyan: #00ffcc;
            --neon-pink: #ff0055;
            --neon-yellow: #ffcc00;
            --text: #c9d1d9;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; height: 100vh;
        }
        header {
            padding: 12px 20px; background-color: var(--card-bg);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #30363d;
        }
        h1 { margin: 0; font-size: 1.1rem; color: #fff; letter-spacing: 1px; }
        .btn {
            background-color: var(--neon-cyan); color: #000;
            border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .controls {
            display: flex; gap: 10px; padding: 12px 20px 0 20px;
        }
        .btn-measure { background-color: #238636; color: #fff; flex: 1; font-size: 0.95rem; padding: 10px; border-radius: 8px; border: none; font-weight: bold; }
        .btn-measure.active { background-color: var(--neon-pink); animation: pulse 1.5s infinite; }
        .btn-measure.review { background-color: #d29922; }
        .btn-export { background-color: #30363d; color: #8b949e; flex: 1; pointer-events: none; border-radius: 8px; border: none; font-weight: bold; }
        .btn-export.ready { background-color: #1f6beb; color: #fff; pointer-events: auto; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        
        .dashboard { padding: 12px 20px; flex-grow: 1; display: flex; flex-direction: column; }
        
        .gait-badge {
            align-self: center; background-color: #21262d; border: 1px solid #30363d;
            padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold;
            color: var(--neon-yellow); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        
        .kpi-container { display: flex; gap: 10px; margin-bottom: 10px; }
        .kpi-box {
            background-color: var(--card-bg); padding: 12px; border-radius: 10px;
            flex: 1; text-align: center; border: 1px solid #30363d;
        }
        .kpi-title { font-size: 0.75rem; color: #8b949e; margin-bottom: 4px; text-transform: uppercase; }
        .kpi-value { font-size: 1.5rem; font-weight: bold; color: var(--neon-cyan); }
        .kpi-value.pink { color: var(--neon-pink); }
        .kpi-value.yellow { color: var(--neon-yellow); }

        .chart-container { flex-grow: 1; position: relative; width: 100%; min-height: 180px; }
        
        .gait-distribution {
            display: none; height: 8px; width: 100%; border-radius: 4px; margin-top: 10px; overflow: hidden;
        }
        .gait-distribution.show { display: flex; }
        .gait-segment { height: 100%; }
        .gait-schritt { background-color: #3fb950; }
        .gait-trab { background-color: var(--neon-yellow); }
        .gait-galopp { background-color: var(--neon-pink); }
        .gait-ruhe { background-color: #30363d; }
    </style>
</head>
<body>

    <header>
        <h1>K9MATICS PRO</h1>
        <button id="connectBtn" class="btn">Connect</button>
    </header>

    <div class="controls">
        <button id="measureBtn" class="btn btn-measure">Messung Starten</button>
        <button id="exportBtn" class="btn btn-export">CSV Speichern</button>
    </div>

    <div class="dashboard">
        <div class="gait-badge" id="gaitStatus">Status: Nicht verbunden</div>
        
        <div class="kpi-container">
            <div class="kpi-box">
                <div class="kpi-title">Asymmetrie</div>
                <div class="kpi-value" id="valAsym">-- %</div>
            </div>
            <div class="kpi-box">
                <div class="kpi-title">Stoßkraft</div>
                <div class="kpi-value pink" id="valImpact">-- G</div>
            </div>
            <div class="kpi-box">
                <div class="kpi-title">Schritte</div>
                <div class="kpi-value yellow" id="valSteps">0</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="mainChart"></canvas>
            <div id="gaitDist" class="gait-distribution"></div>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
        
        let bleDevice;
        const LIVE_BUFFER_SIZE = 120;
        let magData = Array(LIVE_BUFFER_SIZE).fill(0);
        let timeData = Array.from({length: LIVE_BUFFER_SIZE}, (_, i) => i);
        let buffer = "";

        // Filter-Speicher für I2C-Dropouts
        let lastX = 0, lastY = 0, lastZ = -1.0;

        // Messungs & Recording Variablen
        let appState = "IDLE"; // IDLE, MEASURING, REVIEW
        let recordedMags = [];
        let recordedGaits = [];
        let recordedSessionCSV = [];
        let recordStartTime = 0;
        let activeGait = "Ruhe";
        let liveInterval;

        // Chart.js Setup
        const ctx = document.getElementById('mainChart').getContext('2d');
        const mainChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: timeData,
                datasets: [{
                    label: 'Magnitude',
                    data: magData, borderColor: '#00ffcc', borderWidth: 2,
                    pointRadius: 0, fill: true, backgroundColor: 'rgba(0, 255, 204, 0.08)', tension: 0.1
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                scales: { 
                    x: { display: false }, 
                    y: { min: 0, max: 4, grid: { color: '#30363d' }, ticks: { color: '#8b949e' } } 
                },
                plugins: { legend: { display: false } }
            }
        });

        // Peak Finder
        function findPeaks(data, height, distance) {
            let peaks = [];
            for (let i = 1; i < data.length - 1; i++) {
                if (data[i] > height && data[i] > data[i - 1] && data[i] > data[i + 1]) {
                    if (peaks.length === 0 || (i - peaks[peaks.length - 1].index) >= distance) {
                        peaks.push({ index: i, value: data[i] });
                    }
                }
            }
            return peaks;
        }

        // Automatische Gangarten-Erkennung
        function detectGait(peaks, recentAvgMag) {
            if (recentAvgMag < 1.12 && peaks.length === 0) return "Ruhe";
            if (peaks.length === 0) return "Bewegung";
            const meanPeakVal = peaks.reduce((a, b) => a + b.value, 0) / peaks.length;
            if (meanPeakVal > 2.7) return "Galopp";
            if (meanPeakVal >= 1.3 && meanPeakVal <= 2.7) return "Trab";
            return "Schritt";
        }

        async function connectBluetooth() {
            try {
                const btn = document.getElementById('connectBtn');
                btn.innerText = "Suche...";
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "K9matics" }, { services: [SERVICE_UUID] }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(CHAR_UUID);
                
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);
                
                btn.innerText = "Verbunden";
                btn.style.backgroundColor = "#ff0055"; btn.style.color = "#fff";
                document.getElementById('gaitStatus').innerText = "Status: Bereit";
                liveInterval = setInterval(updateDashboard, 100);
            } catch (error) {
                console.error(error);
                document.getElementById('connectBtn').innerText = "Connect";
            }
        }

        function handleData(event) {
            if (appState === "REVIEW") return; // Ignoriere neue Daten im Review-Modus

            const value = new TextDecoder().decode(event.target.value);
            buffer += value;
            let lines = buffer.split('\n');
            buffer = lines.pop(); 
            
            const now = Date.now();
            
            for (let line of lines) {
                const match = line.match(/X:([-\d\.]+)\s+Y:([-\d\.]+)\s+Z:([-\d\.]+)/);
                if (match) {
                    let x = parseFloat(match[1]);
                    let y = parseFloat(match[2]);
                    let z = parseFloat(match[3]);

                    // Glitch-Filter
                    if (z === 0 && Math.abs(lastZ) > 0.2) z = lastZ;
                    if (x === 0 && Math.abs(lastX) > 0.2) x = lastX;
                    if (y === 0 && Math.abs(lastY) > 0.2) y = lastY;
                    lastX = x; lastY = y; lastZ = z;

                    const mag = Math.sqrt(x*x + y*y + z*z);
                    
                    magData.push(mag);
                    magData.shift();

                    if (appState === "MEASURING") {
                        const timestamp = ((now - recordStartTime) / 1000).toFixed(3);
                        recordedMags.push(mag);
                        recordedGaits.push(activeGait);
                        recordedSessionCSV.push(`${timestamp},${x},${y},${z},${mag.toFixed(3)},${activeGait}`);
                    }
                }
            }
        }

        function updateDashboard() {
            if (appState === "REVIEW") return;

            // Chart Update (Live oder Measure)
            if (appState === "MEASURING") {
                mainChart.data.datasets[0].borderColor = '#ff0055'; // Rote Linie während Messung
                mainChart.data.datasets[0].backgroundColor = 'rgba(255, 0, 85, 0.08)';
            } else {
                mainChart.data.datasets[0].borderColor = '#00ffcc'; // Cyan im Idle
                mainChart.data.datasets[0].backgroundColor = 'rgba(0, 255, 204, 0.08)';
            }
            mainChart.update();

            // Auswertung
            const peaks = findPeaks(magData, 1.25, 7);
            const recentAvg = magData.slice(-20).reduce((a, b) => a + b, 0) / 20;
            
            activeGait = detectGait(peaks, recentAvg);
            
            if (appState === "MEASURING") {
                document.getElementById('gaitStatus').innerText = `🔴 Aufzeichnung... | ${activeGait}`;
            } else {
                document.getElementById('gaitStatus').innerText = `Live: ${activeGait}`;
            }

            // KPIs Live updaten während Messung
            if (appState === "MEASURING") {
                // Wir werten den bisherigen aufgenommenen Bereich aus, nicht nur den Buffer
                const allPeaks = findPeaks(recordedMags, 1.25, 7);
                document.getElementById('valSteps').innerText = allPeaks.length;
                
                if (allPeaks.length > 0) {
                    const peakVals = allPeaks.map(p => p.value);
                    const meanImpact = peakVals.reduce((a, b) => a + b, 0) / peakVals.length;
                    document.getElementById('valImpact').innerText = meanImpact.toFixed(2) + " G";

                    if (peakVals.length >= 4) {
                        const lefts = peakVals.filter((_, i) => i % 2 === 0);
                        const rights = peakVals.filter((_, i) => i % 2 !== 0);
                        if (lefts.length > 0 && rights.length > 0) {
                            const meanL = lefts.reduce((a, b) => a + b, 0) / lefts.length;
                            const meanR = rights.reduce((a, b) => a + b, 0) / rights.length;
                            const asym = Math.abs(meanL - meanR) / ((meanL + meanR) / 2) * 100;
                            document.getElementById('valAsym').innerText = asym.toFixed(1) + "%";
                        }
                    }
                }
            }
        }

        function showReview() {
            // Chart friert den aufgenommenen Bereich ein
            const labels = Array.from({length: recordedMags.length}, (_, i) => i);
            mainChart.data.labels = labels;
            mainChart.data.datasets[0].data = recordedMags;
            mainChart.data.datasets[0].borderColor = '#ffcc00'; // Gelb für Review
            mainChart.data.datasets[0].backgroundColor = 'rgba(255, 204, 0, 0.08)';
            mainChart.options.scales.x.display = true; // Zeige x-Achse leicht an
            mainChart.update();

            // Gangarten-Verteilung berechnen und anzeigen
            let counts = { "Ruhe": 0, "Schritt": 0, "Trab": 0, "Galopp": 0, "Bewegung": 0 };
            recordedGaits.forEach(g => { if(counts[g] !== undefined) counts[g]++; });
            
            const total = recordedGaits.length || 1;
            const distDiv = document.getElementById('gaitDist');
            distDiv.innerHTML = '';
            
            const colors = { "Schritt": "gait-schritt", "Trab": "gait-trab", "Galopp": "gait-galopp", "Ruhe": "gait-ruhe", "Bewegung": "gait-ruhe" };
            
            for (const [gait, count] of Object.entries(counts)) {
                if (count > 0) {
                    const pct = (count / total) * 100;
                    const segment = document.createElement('div');
                    segment.className = `gait-segment ${colors[gait]}`;
                    segment.style.width = `${pct}%`;
                    segment.title = `${gait} (${pct.toFixed(0)}%)`;
                    distDiv.appendChild(segment);
                }
            }
            distDiv.classList.add('show');
            document.getElementById('gaitStatus').innerText = "Zusammenfassung der Messung";
        }

        document.getElementById('measureBtn').addEventListener('click', () => {
            const measureBtn = document.getElementById('measureBtn');
            const exportBtn = document.getElementById('exportBtn');
            const distDiv = document.getElementById('gaitDist');
            
            if (appState === "IDLE") {
                // START MEASUREMENT
                appState = "MEASURING";
                recordStartTime = Date.now();
                recordedSessionCSV = ["Time_Sec,X,Y,Z,Magnitude,Gangart"];
                recordedMags = [];
                recordedGaits = [];
                distDiv.classList.remove('show');
                
                measureBtn.innerText = "Messung Stoppen";
                measureBtn.classList.add("active");
                measureBtn.classList.remove("review");
                exportBtn.classList.remove("ready");
                
                document.getElementById('valAsym').innerText = "...";
                document.getElementById('valImpact').innerText = "...";
                document.getElementById('valSteps').innerText = "0";

            } else if (appState === "MEASURING") {
                // STOP MEASUREMENT & SHOW REVIEW
                appState = "REVIEW";
                measureBtn.innerText = "Live / Neue Messung";
                measureBtn.classList.remove("active");
                measureBtn.classList.add("review");
                
                if (recordedSessionCSV.length > 1) {
                    exportBtn.classList.add("ready");
                    showReview();
                }

            } else if (appState === "REVIEW") {
                // BACK TO LIVE IDLE
                appState = "IDLE";
                measureBtn.innerText = "Messung Starten";
                measureBtn.classList.remove("review");
                exportBtn.classList.remove("ready");
                distDiv.classList.remove('show');
                
                // Chart zurücksetzen
                mainChart.data.labels = timeData;
                mainChart.data.datasets[0].data = magData;
                mainChart.options.scales.x.display = false;
                mainChart.update();
                
                document.getElementById('valAsym').innerText = "-- %";
                document.getElementById('valImpact').innerText = "-- G";
                document.getElementById('valSteps').innerText = "0";
                document.getElementById('gaitStatus').innerText = "Status: Bereit";
            }
        });

        // CSV Export
        document.getElementById('exportBtn').addEventListener('click', () => {
            if (recordedSessionCSV.length <= 1) return;
            const csvContent = recordedSessionCSV.join("\n");
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            const dateStr = new Date().toISOString().slice(0,19).replace(/[:T]/g, "-");
            link.setAttribute("href", url);
            link.setAttribute("download", `k9_lauf_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        document.getElementById('connectBtn').addEventListener('click', connectBluetooth);
    </script>
</body>
</html>
