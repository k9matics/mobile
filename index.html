<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K9matics Mobile</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --neon-cyan: #00ffcc;
            --neon-pink: #ff0055;
            --text: #c9d1d9;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, sans-serif;
            display: flex; flex-direction: column; height: 100vh;
        }
        header {
            padding: 15px 20px; background-color: var(--card-bg);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #30363d;
        }
        h1 { margin: 0; font-size: 1.2rem; color: #fff; }
        .btn {
            background-color: var(--neon-cyan); color: #000;
            border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
        .controls {
            display: flex; gap: 10px; padding: 15px 20px 0 20px;
        }
        .btn-measure { background-color: #238636; color: #fff; flex: 1; font-size: 1rem; padding: 12px; }
        .btn-measure.active { background-color: var(--neon-pink); animation: pulse 1.5s infinite; }
        .btn-export { background-color: #30363d; color: #8b949e; flex: 1; pointer-events: none; }
        .btn-export.ready { background-color: #1f6beb; color: #fff; pointer-events: auto; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        
        .dashboard { padding: 15px 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .status-bar { text-align: center; font-size: 0.85rem; color: #8b949e; margin-bottom: 10px; }
        .kpi-container { display: flex; gap: 15px; margin-bottom: 15px; }
        .kpi-box {
            background-color: var(--card-bg); padding: 15px; border-radius: 12px;
            flex: 1; text-align: center; border: 1px solid #30363d;
        }
        .kpi-title { font-size: 0.8rem; color: #8b949e; margin-bottom: 5px; text-transform: uppercase; }
        .kpi-value { font-size: 1.8rem; font-weight: bold; color: var(--neon-cyan); }
        .kpi-value.pink { color: var(--neon-pink); }
        .chart-container { flex-grow: 1; position: relative; width: 100%; min-height: 200px; }
    </style>
</head>
<body>

    <header>
        <h1>K9MATICS</h1>
        <button id="connectBtn" class="btn">Connect</button>
    </header>

    <div class="controls">
        <button id="measureBtn" class="btn btn-measure">Messung Starten</button>
        <button id="exportBtn" class="btn btn-export">CSV Speichern</button>
    </div>

    <div class="dashboard">
        <div class="status-bar" id="statusText">Sensor verbinden, dann Messung starten.</div>
        <div class="kpi-container">
            <div class="kpi-box">
                <div class="kpi-title">Asymmetrie</div>
                <div class="kpi-value" id="valAsym">-- %</div>
            </div>
            <div class="kpi-box">
                <div class="kpi-title">Mittlere Stoßkraft</div>
                <div class="kpi-value pink" id="valImpact">-- G</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="liveChart"></canvas>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
        
        let bleDevice;
        let magData = Array(100).fill(0);
        let timeData = Array.from({length: 100}, (_, i) => i);
        let buffer = "";

        // Messung & Recording
        let isMeasuring = false;
        let recordedSession = [];
        let sessionPeaksData = [];
        let recordStartTime = 0;

        const ctx = document.getElementById('liveChart').getContext('2d');
        const liveChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: timeData,
                datasets: [{
                    data: magData, borderColor: '#00ffcc', borderWidth: 2,
                    pointRadius: 0, fill: true, backgroundColor: 'rgba(0, 255, 204, 0.1)', tension: 0.1
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                scales: { x: { display: false }, y: { min: 0, max: 4, grid: { color: '#30363d' }, ticks: { color: '#8b949e' } } },
                plugins: { legend: { display: false } }
            }
        });

        function findPeaks(data, height, distance) {
            let peaks = [];
            for (let i = 1; i < data.length - 1; i++) {
                if (data[i] > height && data[i] > data[i - 1] && data[i] > data[i + 1]) {
                    if (peaks.length === 0 || (i - peaks[peaks.length - 1].index) >= distance) {
                        peaks.push({ index: i, value: data[i] });
                    }
                }
            }
            return peaks;
        }

        async function connectBluetooth() {
            try {
                const btn = document.getElementById('connectBtn');
                btn.innerText = "Suche...";
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "K9matics" }, { services: [SERVICE_UUID] }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(CHAR_UUID);
                
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);
                
                btn.innerText = "Verbunden";
                btn.style.backgroundColor = "#ff0055"; btn.style.color = "#fff";
                document.getElementById('statusText').innerText = "Bereit für Messung.";
                setInterval(updateDashboard, 100);
            } catch (error) {
                console.error(error);
                document.getElementById('connectBtn').innerText = "Connect";
            }
        }

        function handleData(event) {
            const value = new TextDecoder().decode(event.target.value);
            buffer += value;
            let lines = buffer.split('\n');
            buffer = lines.pop(); 
            
            const now = Date.now();
            
            for (let line of lines) {
                const match = line.match(/X:([-\d\.]+)\s+Y:([-\d\.]+)\s+Z:([-\d\.]+)/);
                if (match) {
                    const x = parseFloat(match[1]);
                    const y = parseFloat(match[2]);
                    const z = parseFloat(match[3]);
                    const mag = Math.sqrt(x*x + y*y + z*z);
                    
                    magData.push(mag);
                    magData.shift();

                    if (isMeasuring) {
                        const timestamp = ((now - recordStartTime) / 1000).toFixed(3);
                        recordedSession.push(`${timestamp},${x},${y},${z},${mag.toFixed(3)}`);
                    }
                }
            }
        }

        function updateDashboard() {
            liveChart.update();

            // Nur Auswerten, wenn eine Messung AKTIV läuft
            if (isMeasuring) {
                const peaks = findPeaks(magData, 1.2, 8);
                if (peaks.length > 0) {
                    const peakVals = peaks.map(p => p.value);
                    const meanImpact = peakVals.reduce((a, b) => a + b, 0) / peakVals.length;
                    document.getElementById('valImpact').innerText = meanImpact.toFixed(2) + " G";

                    if (peakVals.length >= 4) {
                        const lefts = peakVals.filter((_, i) => i % 2 === 0);
                        const rights = peakVals.filter((_, i) => i % 2 !== 0);
                        if (lefts.length > 0 && rights.length > 0) {
                            const meanL = lefts.reduce((a, b) => a + b, 0) / lefts.length;
                            const meanR = rights.reduce((a, b) => a + b, 0) / rights.length;
                            const asym = Math.abs(meanL - meanR) / ((meanL + meanR) / 2) * 100;
                            document.getElementById('valAsym').innerText = asym.toFixed(1) + "%";
                        }
                    }
                }
            }
        }

        // Messung Start / Stop Steuerung
        document.getElementById('measureBtn').addEventListener('click', () => {
            const measureBtn = document.getElementById('measureBtn');
            const exportBtn = document.getElementById('exportBtn');
            const statusText = document.getElementById('statusText');
            
            if (!isMeasuring) {
                // START
                isMeasuring = true;
                recordStartTime = Date.now();
                recordedSession = ["Time_Sec,X,Y,Z,Magnitude"];
                
                measureBtn.innerText = "Messung Stoppen";
                measureBtn.classList.add("active");
                exportBtn.classList.remove("ready");
                
                document.getElementById('valAsym').innerText = "...";
                document.getElementById('valImpact').innerText = "...";
                statusText.innerText = "Messung läuft... Hund gleichmäßig laufen lassen!";
            } else {
                // STOP
                isMeasuring = false;
                measureBtn.innerText = "Neue Messung";
                measureBtn.classList.remove("active");
                
                statusText.innerText = "Messung beendet. Endergebnis oben eingefroren.";
                if (recordedSession.length > 1) {
                    exportBtn.classList.add("ready");
                }
            }
        });

        // CSV Export
        document.getElementById('exportBtn').addEventListener('click', () => {
            if (recordedSession.length <= 1) return;
            const csvContent = recordedSession.join("\n");
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            const dateStr = new Date().toISOString().slice(0,19).replace(/[:T]/g, "-");
            link.setAttribute("href", url);
            link.setAttribute("download", `k9_lauf_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        document.getElementById('connectBtn').addEventListener('click', connectBluetooth);
    </script>
</body>
</html>
