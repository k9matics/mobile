<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K9matics Mobile</title>
    <!-- Chart.js für den Graphen -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --neon-cyan: #00ffcc;
            --neon-pink: #ff0055;
            --text: #c9d1d9;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; height: 100vh;
        }
        header {
            padding: 15px 20px;
            background-color: var(--card-bg);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #30363d;
        }
        h1 { margin: 0; font-size: 1.2rem; color: #fff; }
        .btn {
            background-color: var(--neon-cyan);
            color: #000;
            border: none; padding: 10px 15px;
            border-radius: 8px; font-weight: bold;
            cursor: pointer; font-size: 1rem;
        }
        .btn:active { opacity: 0.8; }
        .dashboard { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .kpi-container {
            display: flex; gap: 15px; margin-bottom: 20px;
        }
        .kpi-box {
            background-color: var(--card-bg);
            padding: 15px; border-radius: 12px;
            flex: 1; text-align: center;
            border: 1px solid #30363d;
        }
        .kpi-title { font-size: 0.8rem; color: #8b949e; margin-bottom: 5px; text-transform: uppercase; }
        .kpi-value { font-size: 1.8rem; font-weight: bold; color: var(--neon-cyan); }
        .kpi-value.pink { color: var(--neon-pink); }
        .chart-container {
            flex-grow: 1; position: relative; width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>K9MATICS PRO</h1>
        <button id="connectBtn" class="btn">Connect</button>
    </header>

    <div class="dashboard">
        <div class="kpi-container">
            <div class="kpi-box">
                <div class="kpi-title">Asymmetrie</div>
                <div class="kpi-value" id="valAsym">0.0%</div>
            </div>
            <div class="kpi-box">
                <div class="kpi-title">Stoßkraft</div>
                <div class="kpi-value pink" id="valImpact">0.00 G</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="liveChart"></canvas>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
        
        let bleDevice;
        let magData = Array(100).fill(0);
        let timeData = Array.from({length: 100}, (_, i) => i);
        let buffer = "";

        // Chart.js Setup
        const ctx = document.getElementById('liveChart').getContext('2d');
        const liveChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: timeData,
                datasets: [{
                    label: 'Rohdaten (G)',
                    data: magData,
                    borderColor: '#00ffcc',
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: true,
                    backgroundColor: 'rgba(0, 255, 204, 0.1)',
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    x: { display: false },
                    y: { 
                        min: 0, max: 4, 
                        grid: { color: '#30363d' },
                        ticks: { color: '#8b949e' }
                    }
                },
                plugins: { legend: { display: false } }
            }
        });

        // Eigener Peak-Finder (Ersatz für Python's scipy.signal.find_peaks)
        function findPeaks(data, height, distance) {
            let peaks = [];
            for (let i = 1; i < data.length - 1; i++) {
                if (data[i] > height && data[i] > data[i - 1] && data[i] > data[i + 1]) {
                    if (peaks.length === 0 || (i - peaks[peaks.length - 1].index) >= distance) {
                        peaks.push({ index: i, value: data[i] });
                    }
                }
            }
            return peaks;
        }

        async function connectBluetooth() {
            try {
                const btn = document.getElementById('connectBtn');
                btn.innerText = "Suche...";
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "K9matics" }, { services: [SERVICE_UUID] }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(CHAR_UUID);
                
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);
                
                btn.innerText = "Verbunden";
                btn.style.backgroundColor = "#ff0055";
                btn.style.color = "#fff";
                
                // Update Dashboard 10x pro Sekunde (statt bei jedem Wert, spart Akku)
                setInterval(updateDashboard, 100);
            } catch (error) {
                console.error("Bluetooth Fehler:", error);
                document.getElementById('connectBtn').innerText = "Connect";
            }
        }

        function handleData(event) {
            const value = new TextDecoder().decode(event.target.value);
            buffer += value;
            
            let lines = buffer.split('\n');
            buffer = lines.pop(); // Unvollständige Zeile behalten
            
            for (let line of lines) {
                const match = line.match(/X:([-\d\.]+)\s+Y:([-\d\.]+)\s+Z:([-\d\.]+)/);
                if (match) {
                    const x = parseFloat(match[1]);
                    const y = parseFloat(match[2]);
                    const z = parseFloat(match[3]);
                    const mag = Math.sqrt(x*x + y*y + z*z);
                    
                    magData.push(mag);
                    magData.shift(); // Ältesten Wert löschen (Array bei 100 Punkten halten)
                }
            }
        }

        function updateDashboard() {
            liveChart.update();

            // Analyse
            const peaks = findPeaks(magData, 1.2, 8);
            if (peaks.length > 0) {
                const peakVals = peaks.map(p => p.value);
                const meanImpact = peakVals.reduce((a, b) => a + b, 0) / peakVals.length;
                document.getElementById('valImpact').innerText = meanImpact.toFixed(2) + " G";

                if (peakVals.length >= 4) {
                    const lefts = peakVals.filter((_, i) => i % 2 === 0);
                    const rights = peakVals.filter((_, i) => i % 2 !== 0);
                    
                    if (lefts.length > 0 && rights.length > 0) {
                        const meanL = lefts.reduce((a, b) => a + b, 0) / lefts.length;
                        const meanR = rights.reduce((a, b) => a + b, 0) / rights.length;
                        const asym = Math.abs(meanL - meanR) / ((meanL + meanR) / 2) * 100;
                        document.getElementById('valAsym').innerText = asym.toFixed(1) + "%";
                    }
                }
            }
        }

        document.getElementById('connectBtn').addEventListener('click', connectBluetooth);
    </script>
</body>
</html>
