<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>K9matics Pro Tactical v5.8</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Externe Bibliotheken -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        :root { 
            --bg: #050709; 
            --card-bg: #0d1117;
            --tactical-oliv: #2e3f1b;
            --tactical-oliv-hover: #3d5424;
            --tactical-red: #b3002d;
            --neon-cyan: #00ffcc; 
            --neon-yellow: #ffcc00; 
            --text: #c9d1d9; 
            --hud-border: rgba(0, 255, 204, 0.3);
        }
        * { box-sizing: border-box; touch-action: manipulation; }
        html, body { 
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; 
            background: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace; 
            background-image: radial-gradient(circle at top, #1a221b, var(--bg));
        }
        body { display: flex; flex-direction: column; justify-content: space-between; padding: 4px; }
        
        header { 
            padding: 4px 8px; background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(10px); 
            display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid var(--tactical-oliv); border-radius: 4px; gap: 4px; flex-shrink: 0;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        
        h1 { 
            margin: 0; font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; color: #fff; letter-spacing: 1.5px; 
            flex-grow: 1; text-shadow: 0 0 8px rgba(0, 255, 204, 0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
        }
        .version { font-size: 0.5em; color: var(--tactical-red); vertical-align: super; background: rgba(179,0,45,0.2); padding: 1px 3px; border-radius: 2px; border: 1px solid var(--tactical-red); }
        
        .btn { 
            background-color: var(--tactical-oliv); color: #fff; border: 1px solid rgba(0,255,204,0.3); padding: 4px 8px; border-radius: 4px; 
            font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; cursor: pointer; white-space: nowrap; 
            box-shadow: inset 0 0 5px rgba(0,255,204,0.1); transition: all 0.2s ease;
        }
        .btn:active { transform: scale(0.95); background-color: var(--tactical-oliv-hover); }
        .btn-calib { background-color: #161b22; border-color: #30363d; color: #8b949e; }
        
        .controls { display: flex; gap: 4px; width: 100%; flex-shrink: 0; }
        .btn-measure { 
            background-color: var(--tactical-oliv); color: #fff; flex: 1.2; font-size: 0.95rem; padding: 6px; border-radius: 4px; 
            border: 1px solid var(--tactical-oliv-hover); font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; text-align: center;
        }
        .btn-measure.active { background-color: var(--tactical-red); border-color: #ff0055; box-shadow: 0 0 12px rgba(179, 0, 45, 0.8); animation: pulse 1.5s infinite; }
        .btn-measure.review { background-color: #8c6b00; border-color: var(--neon-yellow); }
        
        .btn-action { 
            background-color: var(--card-bg); color: #8b949e; flex: 1; border-radius: 4px; 
            border: 1px solid #30363d; font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; padding: 6px 0; text-align: center; 
        }
        .btn-action.ready { background-color: #1f6beb; color: #fff; border-color: #388bfd; box-shadow: 0 0 8px rgba(31,107,235,0.4); }
        .btn-action.pdf-ready { background-color: var(--tactical-oliv-hover); color: #fff; border-color: var(--neon-cyan); box-shadow: 0 0 8px rgba(0,255,204,0.3); }
        
        @keyframes pulse { 0% { box-shadow: 0 0 5px rgba(179, 0, 45, 0.4); } 50% { box-shadow: 0 0 15px rgba(179, 0, 45, 0.9); } 100% { box-shadow: 0 0 5px rgba(179, 0, 45, 0.4); } }
        
        .dashboard { 
            flex-grow: 1; display: flex; flex-direction: column; width: 100%; 
            overflow: hidden; justify-content: space-between; gap: 4px; margin-top: 4px;
        }
        
        .gait-badge { 
            align-self: center; background: rgba(13, 17, 23, 0.9); backdrop-filter: blur(8px); border: 1px solid var(--hud-border); 
            padding: 2px 12px; border-radius: 4px; font-family: 'Bebas Neue', sans-serif; font-size: 0.85rem; letter-spacing: 1.5px; 
            color: var(--neon-yellow); text-transform: uppercase; flex-shrink: 0; box-shadow: 0 0 10px rgba(0,255,204,0.05); 
        }
        
        .kpi-container { display: flex; gap: 4px; width: 100%; flex-shrink: 0; }
        .glass-box { 
            background: var(--card-bg); border: 1px solid #30363d; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5); padding: 4px; border-radius: 4px; flex: 1; text-align: center; min-width: 0; 
        }
        .kpi-title { font-size: 0.45rem; color: #8b949e; margin-bottom: 1px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold; }
        .kpi-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.15rem; letter-spacing: 1px; color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0,255,204,0.3); }
        
        /* 6-AXIS HUD FADENKREUZ */
        #hud-radar-container { 
            width: 100%; flex-grow: 1.5; background: radial-gradient(circle, #0b141f 0%, #050709 100%); 
            border: 1px solid var(--neon-cyan); border-radius: 6px; 
            overflow: hidden; position: relative; box-shadow: inset 0 0 20px rgba(0,255,204,0.15); min-height: 120px;
            display: flex; align-items: center; justify-content: center;
        }
        #hud-radar-container::before {
            content: ''; position: absolute; inset: 6px; border: 1px dashed rgba(0,255,204,0.15); pointer-events: none;
        }
        .radar-ring {
            position: absolute; width: 100px; height: 100px; border: 1px solid rgba(0,255,204,0.3); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .crosshair-h { position: absolute; width: 100%; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,255,204,0.5), transparent); }
        .crosshair-v { position: absolute; width: 1px; height: 100%; background: linear-gradient(180deg, transparent, rgba(0,255,204,0.5), transparent); }
        #radar-dot {
            width: 12px; height: 12px; background: var(--neon-cyan); border: 2px solid #fff; border-radius: 50%; position: absolute;
            box-shadow: 0 0 12px var(--neon-cyan), 0 0 4px #fff; transition: transform 0.04s ease-out; z-index: 2;
        }
        .hud-label { position: absolute; top: 6px; left: 8px; font-size: 0.5rem; color: var(--neon-cyan); letter-spacing: 1px; opacity: 0.8; }
        .hud-coords { position: absolute; bottom: 6px; right: 8px; font-size: 0.5rem; color: var(--neon-cyan); letter-spacing: 0.5px; opacity: 0.7; }
        
        #debugRaw { font-size: 0.5rem; color: rgba(139, 148, 158, 0.4); text-align: center; margin: 0; font-family: monospace; flex-shrink: 0; }
        
        .chart-container { 
            flex-grow: 2; width: 100%; min-height: 110px; background: #07090e; border: 1px solid #30363d; border-radius: 4px; padding: 4px; 
            position: relative; display: flex; flex-direction: column;
        }
        .chart-container canvas { flex-grow: 1; width: 100% !important; height: 100% !important; }
        
        .gait-distribution { display: none; height: 5px; width: 100%; border-radius: 2px; margin-top: 2px; overflow: hidden; flex-shrink: 0; }
        .gait-distribution.show { display: flex; }
        .gait-segment { height: 100%; }
        .gait-schritt { background-color: #3fb950; }
        .gait-trab { background-color: var(--neon-yellow); }
        .gait-galopp { background-color: var(--tactical-red); }
        .gait-ruhe { background-color: #21262d; }

        #pullRefreshIndicator {
            position: fixed; top: -50px; left: 0; width: 100%; height: 50px;
            background: var(--card-bg); color: var(--neon-cyan); display: flex;
            align-items: center; justify-content: center; font-size: 0.75rem; border-bottom: 1px solid var(--tactical-oliv);
            transition: transform 0.2s ease; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="pullRefreshIndicator">↓ Zum Aktualisieren nach unten ziehen</div>

    <header>
        <h1>K9MATICS <span class="version">v5.8</span></h1>
        <button id="calibrateBtn" class="btn btn-calib">NULLPUNKT</button>
        <button id="connectBtn" class="btn" style="border-color: var(--neon-cyan); color: var(--neon-cyan);">CONNECT</button>
    </header>

    <div class="controls">
        <button id="measureBtn" class="btn btn-measure">STARTEN</button>
        <button id="exportBtn" class="btn btn-action" disabled>CSV</button>
        <button id="pdfBtn" class="btn btn-action" disabled>PDF</button>
    </div>

    <div class="dashboard">
        
        <div class="gait-badge" id="gaitStatus">STATUS: GETRENNT (6-AXIS TELEMETRIE)</div>
        
        <div class="kpi-container">
            <div class="glass-box">
                <div class="kpi-title">ASYMMETRIE</div>
                <div class="kpi-value" id="valAsym">-- %</div>
            </div>
            <div class="glass-box">
                <div class="kpi-title">STOSSKRAFT</div>
                <div class="kpi-value" id="valImpact" style="color: var(--tactical-red); text-shadow: 0 0 8px rgba(179,0,45,0.5);">-- G</div>
            </div>
            <div class="glass-box">
                <div class="kpi-title">SCHRITTE</div>
                <div class="kpi-value" id="valSteps" style="color: var(--neon-yellow); text-shadow: 0 0 8px rgba(255,204,0,0.4);">0</div>
            </div>
        </div>

        <!-- 6-Axis HUD Vektor Anzeige -->
        <div id="hud-radar-container">
            <div class="hud-label">6-AXIS TELEMETRY // HUD</div>
            <div class="crosshair-h"></div>
            <div class="crosshair-v"></div>
            <div class="radar-ring"></div>
            <div id="radar-dot"></div>
            <div class="hud-coords" id="hudCoords">AX: 0.00 | AY: 0.00</div>
        </div>
        <div id="debugRaw">Warte auf 6-Achsen-Sensordaten...</div>

        <div class="chart-container">
            <canvas id="mainChart"></canvas>
            <div id="gaitDist" class="gait-distribution"></div>
        </div>
    </div>

    <script>
        let touchStartY = 0;
        const indicator = document.getElementById('pullRefreshIndicator');

        window.addEventListener('touchstart', (e) => {
            if (window.scrollY === 0) touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (window.scrollY === 0 && (e.touches[0].clientY - touchStartY) > 80) {
                indicator.style.transform = "translateY(50px)";
                indicator.innerText = "⟳ Loslassen zum Aktualisieren...";
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (window.scrollY === 0 && (e.changedTouches[0].clientY - touchStartY) > 80) {
                window.location.reload();
            } else {
                indicator.style.transform = "translateY(0)";
            }
        }, { passive: true });

        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
        
        let bleDevice;
        const LIVE_BUFFER_SIZE = 100;
        
        // 6 Achsen + Magnitude Buffer
        let magData = Array(LIVE_BUFFER_SIZE).fill(0);
        let axData = Array(LIVE_BUFFER_SIZE).fill(0);
        let ayData = Array(LIVE_BUFFER_SIZE).fill(0);
        let azData = Array(LIVE_BUFFER_SIZE).fill(0);
        let gxData = Array(LIVE_BUFFER_SIZE).fill(0);
        let gyData = Array(LIVE_BUFFER_SIZE).fill(0);
        let gzData = Array(LIVE_BUFFER_SIZE).fill(0);
        let timeData = Array.from({length: LIVE_BUFFER_SIZE}, (_, i) => i);
        let buffer = "";

        let appState = "IDLE"; 
        let recordedMags = [], recordedAX = [], recordedAY = [], recordedAZ = [], recordedGX = [], recordedGY = [], recordedGZ = [], recordedGaits = [], recordedSessionCSV = [];
        let recordStartTime = 0;
        let activeGait = "Ruhe";
        
        let offsetX = 0, offsetY = 0, offsetZ = 0;
        let rawLastX = 0, rawLastY = 0, rawLastZ = 0;

        let dynamicWalkTrot = 1.30;
        let dynamicTrotGallop = 2.70;
        let recentPeakHistory = [];

        function autoTuneThresholds(peakVal) {
            recentPeakHistory.push(peakVal);
            if(recentPeakHistory.length > 20) recentPeakHistory.shift();
            if(recentPeakHistory.length >= 5) {
                const avg = recentPeakHistory.reduce((a,b)=>a+b,0) / recentPeakHistory.length;
                if(avg > 1.2 && avg < 3.5) {
                    dynamicWalkTrot = 1.15 + (avg * 0.1);
                    dynamicTrotGallop = 2.20 + (avg * 0.2);
                }
            }
        }

        document.getElementById('calibrateBtn').addEventListener('click', () => {
            offsetX = rawLastX;
            offsetY = rawLastY;
            offsetZ = rawLastZ;
            const btn = document.getElementById('calibrateBtn');
            btn.innerText = "NULL ✓";
            btn.style.backgroundColor = "var(--neon-cyan)";
            btn.style.color = "#000";
            setTimeout(() => {
                btn.innerText = "NULLPUNKT";
                btn.style.backgroundColor = "#161b22";
                btn.style.color = "#8b949e";
            }, 2000);
        });

        // Chart Setup für alle 6 Achsen + Magnitude
        const ctx = document.getElementById('mainChart').getContext('2d');
        let gradientIdle = ctx.createLinearGradient(0, 0, 0, 200);
        gradientIdle.addColorStop(0, 'rgba(0, 255, 204, 0.25)'); gradientIdle.addColorStop(1, 'rgba(0, 255, 204, 0.0)');

        let gradientMeas = ctx.createLinearGradient(0, 0, 0, 200);
        gradientMeas.addColorStop(0, 'rgba(179, 0, 45, 0.35)'); gradientMeas.addColorStop(1, 'rgba(179, 0, 45, 0.0)');

        const mainChart = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: timeData, 
                datasets: [
                    { label: 'Kraft (Mag)', data: magData, borderColor: 'var(--neon-cyan)', borderWidth: 2, pointRadius: 0, fill: true, backgroundColor: gradientIdle, tension: 0.2 },
                    { label: 'AX', data: axData, borderColor: 'rgba(179,0,45,0.6)', borderWidth: 1, pointRadius: 0, tension: 0.1, fill: false },
                    { label: 'AY', data: ayData, borderColor: 'rgba(63,185,80,0.6)', borderWidth: 1, pointRadius: 0, tension: 0.1, fill: false },
                    { label: 'AZ', data: azData, borderColor: 'rgba(88,166,255,0.6)', borderWidth: 1, pointRadius: 0, tension: 0.1, fill: false },
                    { label: 'GX', data: gxData, borderColor: 'rgba(255,204,0,0.6)', borderWidth: 1, pointRadius: 0, tension: 0.1, fill: false },
                    { label: 'GY', data: gyData, borderColor: 'rgba(255,100,0,0.6)', borderWidth: 1, pointRadius: 0, tension: 0.1, fill: false },
                    { label: 'GZ', data: gzData, borderColor: 'rgba(200,100,255,0.6)', borderWidth: 1, pointRadius: 0, tension: 0.1, fill: false }
                ] 
            },
            options: { 
                responsive: true, maintainAspectRatio: false, animation: false, 
                scales: { 
                    x: { display: false }, 
                    y: { suggestedMin: -2.0, suggestedMax: 3.0, grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#8b949e', font: { size: 9 } } } 
                }, 
                plugins: { legend: { display: true, labels: { color: '#c9d1d9', boxWidth: 6, font: { size: 8 } } } } 
            }
        });

        function findPeaks(data, height, distance) {
            let peaks = [];
            for (let i = 1; i < data.length - 1; i++) {
                if (data[i] > height && data[i] > data[i - 1] && data[i] > data[i + 1]) {
                    if (peaks.length === 0 || (i - peaks[peaks.length - 1].index) >= distance) { peaks.push({ index: i, value: data[i] }); }
                }
            }
            return peaks;
        }

        function detectGait(peaks, recentAvgMag) {
            if (recentAvgMag < 1.12 && peaks.length === 0) return "Ruhe";
            if (peaks.length === 0) return "Bewegung";
            const meanPeakVal = peaks.reduce((a, b) => a + b.value, 0) / peaks.length;
            if (meanPeakVal > dynamicTrotGallop) return "Galopp";
            if (meanPeakVal >= dynamicWalkTrot && meanPeakVal <= dynamicTrotGallop) return "Trab";
            return "Schritt";
        }

        async function connectBluetooth() {
            try {
                const btn = document.getElementById('connectBtn'); btn.innerText = "...";
                bleDevice = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: "K9matics" }, { services: [SERVICE_UUID] }], optionalServices: [SERVICE_UUID] });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(CHAR_UUID);
                
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);
                
                btn.innerText = "VERBUNDEN"; btn.style.backgroundColor = "var(--tactical-red)"; btn.style.color = "#fff";
                document.getElementById('gaitStatus').innerText = "STATUS: BEREIT (6-AXIS)";
                setInterval(updateDashboard, 100);
            } catch (error) { document.getElementById('connectBtn').innerText = "CONNECT"; }
        }

        function handleData(event) {
            if (appState === "REVIEW") return;
            buffer += new TextDecoder().decode(event.target.value);
            let lines = buffer.split('\n'); buffer = lines.pop(); const now = Date.now();
            
            for (let line of lines) {
                line = line.trim(); if(!line) continue;
                document.getElementById('debugRaw').innerText = "Raw: " + line;

                let ax = 0, ay = 0, az = 0, gx = 0, gy = 0, gz = 0; let dataFound = false;
                
                // Regex für 6 Achsen (AX, AY, AZ, GX, GY, GZ)
                let mAX = line.match(/(?:AX|A?X):\s*([-\d\.]+)/i); if(mAX) { ax = parseFloat(mAX[1]); dataFound = true; }
                let mAY = line.match(/(?:AY|A?Y):\s*([-\d\.]+)/i); if(mAY) { ay = parseFloat(mAY[1]); dataFound = true; }
                let mAZ = line.match(/(?:AZ|A?Z):\s*([-\d\.]+)/i); if(mAZ) { az = parseFloat(mAZ[1]); dataFound = true; }
                let mGX = line.match(/GX:\s*([-\d\.]+)/i); if(mGX) { gx = parseFloat(mGX[1]); }
                let mGY = line.match(/GY:\s*([-\d\.]+)/i); if(mGY) { gy = parseFloat(mGY[1]); }
                let mGZ = line.match(/GZ:\s*([-\d\.]+)/i); if(mGZ) { gz = parseFloat(mGZ[1]); }

                if (dataFound) {
                    rawLastX = ax; rawLastY = ay; rawLastZ = az;
                    
                    let cleanX = ax - offsetX;
                    let cleanY = ay - offsetY;
                    let cleanZ = az - offsetZ;

                    // HUD Fadenkreuz Update
                    const dot = document.getElementById('radar-dot');
                    const maxOffset = 45;
                    const moveX = Math.max(-maxOffset, Math.min(maxOffset, cleanX * 35));
                    const moveY = Math.max(-maxOffset, Math.min(maxOffset, cleanY * 35));
                    dot.style.transform = `translate(${moveX}px, ${moveY}px)`;
                    document.getElementById('hudCoords').innerText = `AX: ${cleanX.toFixed(2)} | AY: ${cleanY.toFixed(2)}`;

                    const mag = Math.sqrt(cleanX*cleanX + cleanY*cleanY + cleanZ*cleanZ);
                    if(mag > 1.3) autoTuneThresholds(mag);

                    // Pushing in all 6-axis buffers
                    magData.push(mag); magData.shift(); 
                    axData.push(cleanX); axData.shift(); 
                    ayData.push(cleanY); ayData.shift(); 
                    azData.push(cleanZ); azData.shift();
                    gxData.push(gx); gxData.shift();
                    gyData.push(gy); gyData.shift();
                    gzData.push(gz); gzData.shift();

                    if (appState === "MEASURING") {
                        const timestamp = ((now - recordStartTime) / 1000).toFixed(3);
                        recordedMags.push(mag); 
                        recordedAX.push(cleanX); recordedAY.push(cleanY); recordedAZ.push(cleanZ);
                        recordedGX.push(gx); recordedGY.push(gy); recordedGZ.push(gz);
                        recordedGaits.push(activeGait);
                        recordedSessionCSV.push(`${timestamp},${cleanX},${cleanY},${cleanZ},${gx},${gy},${gz},${mag.toFixed(3)},${activeGait}`);
                    }
                }
            }
        }

        function updateDashboard() {
            if (appState === "REVIEW") return;
            
            mainChart.data.datasets[0].borderColor = appState === "MEASURING" ? 'var(--tactical-red)' : 'var(--neon-cyan)';
            mainChart.data.datasets[0].backgroundColor = appState === "MEASURING" ? gradientMeas : gradientIdle;
            mainChart.update();

            const recentData = magData.slice(-35); const livePeaks = findPeaks(recentData, 1.25, 5); 
            const recentAvg = magData.slice(-10).reduce((a, b) => a + b, 0) / 10; 
            
            activeGait = detectGait(livePeaks, recentAvg);
            document.getElementById('gaitStatus').innerText = appState === "MEASURING" ? `🔴 AUFZEICHNUNG... | ${activeGait.toUpperCase()}` : `LIVE: ${activeGait.toUpperCase()}`;

            if (appState === "MEASURING") {
                const allPeaks = findPeaks(recordedMags, 1.25, 7);
                document.getElementById('valSteps').innerText = allPeaks.length;
                if (allPeaks.length > 0) {
                    const peakVals = allPeaks.map(p => p.value);
                    const meanImpact = peakVals.reduce((a, b) => a + b, 0) / peakVals.length;
                    document.getElementById('valImpact').innerText = meanImpact.toFixed(2) + " G";
                    
                    if (peakVals.length >= 4) {
                        const lefts = peakVals.filter((_, i) => i % 2 === 0), rights = peakVals.filter((_, i) => i % 2 !== 0);
                        if (lefts.length > 0 && rights.length > 0) {
                            const meanL = lefts.reduce((a, b) => a + b, 0) / lefts.length, meanR = rights.reduce((a, b) => a + b, 0) / rights.length;
                            const asymCalc = (Math.abs(meanL - meanR) / ((meanL + meanR) / 2) * 100).toFixed(1);
                            document.getElementById('valAsym').innerText = asymCalc + " %";
                        }
                    }
                }
            }
        }

        function showReview() {
            mainChart.data.labels = Array.from({length: recordedMags.length}, (_, i) => i);
            mainChart.data.datasets[0].data = recordedMags; 
            mainChart.data.datasets[1].data = recordedAX; 
            mainChart.data.datasets[2].data = recordedAY; 
            mainChart.data.datasets[3].data = recordedAZ;
            mainChart.data.datasets[4].data = recordedGX;
            mainChart.data.datasets[5].data = recordedGY;
            mainChart.data.datasets[6].data = recordedGZ;
            mainChart.data.datasets[0].borderColor = '#ffcc00';
            mainChart.options.scales.x.display = true; mainChart.update();
            
            let counts = { "Ruhe": 0, "Schritt": 0, "Trab": 0, "Galopp": 0, "Bewegung": 0 };
            recordedGaits.forEach(g => { if(counts[g] !== undefined) counts[g]++; });
            const total = recordedGaits.length || 1; const distDiv = document.getElementById('gaitDist'); distDiv.innerHTML = '';
            const colors = { "Schritt": "gait-schritt", "Trab": "gait-trab", "Galopp": "gait-galopp", "Ruhe": "gait-ruhe", "Bewegung": "gait-ruhe" };
            for (const [gait, count] of Object.entries(counts)) {
                if (count > 0) {
                    const pct = (count / total) * 100; const segment = document.createElement('div');
                    segment.className = `gait-segment ${colors[gait]}`; segment.style.width = `${pct}%`;
                    distDiv.appendChild(segment);
                }
            }
            distDiv.classList.add('show'); document.getElementById('gaitStatus').innerText = "ZUSAMMENFASSUNG DER MESSUNG";
        }

        document.getElementById('measureBtn').addEventListener('click', () => {
            const btn = document.getElementById('measureBtn'), exp = document.getElementById('exportBtn'), pdf = document.getElementById('pdfBtn');
            const distDiv = document.getElementById('gaitDist');
            if (appState === "IDLE") {
                appState = "MEASURING"; recordStartTime = Date.now();
                recordedSessionCSV = ["Time_Sec,AX,AY,AZ,GX,GY,GZ,Magnitude,Gangart"];
                recordedMags = []; recordedAX = []; recordedAY = []; recordedAZ = []; recordedGX = []; recordedGY = []; recordedGZ = []; recordedGaits = []; 
                distDiv.classList.remove('show');
                btn.innerText = "STOPPEN"; btn.classList.add("active"); btn.classList.remove("review");
                exp.disabled = true; pdf.disabled = true; exp.classList.remove("ready"); pdf.classList.remove("pdf-ready");
                document.getElementById('valAsym').innerText = "..."; document.getElementById('valImpact').innerText = "..."; document.getElementById('valSteps').innerText = "0";
            } else if (appState === "MEASURING") {
                appState = "REVIEW"; btn.innerText = "NEUE MESSUNG"; btn.classList.remove("active"); btn.classList.add("review");
                if (recordedSessionCSV.length > 1) { exp.disabled = false; pdf.disabled = false; exp.classList.add("ready"); pdf.classList.add("pdf-ready"); showReview(); }
            } else if (appState === "REVIEW") {
                appState = "IDLE"; btn.innerText = "STARTEN"; btn.classList.remove("review");
                exp.disabled = true; pdf.disabled = true; exp.classList.remove("ready"); pdf.classList.remove("pdf-ready"); distDiv.classList.remove('show');
                mainChart.data.labels = timeData; mainChart.data.datasets[0].data = magData; 
                mainChart.data.datasets[1].data = axData; mainChart.data.datasets[2].data = ayData; mainChart.data.datasets[3].data = azData;
                mainChart.data.datasets[4].data = gxData; mainChart.data.datasets[5].data = gyData; mainChart.data.datasets[6].data = gzData;
                mainChart.options.scales.x.display = false; mainChart.update();
                document.getElementById('valAsym').innerText = "-- %"; document.getElementById('valImpact').innerText = "-- G"; document.getElementById('valSteps').innerText = "0";
                document.getElementById('gaitStatus').innerText = "STATUS: BEREIT";
            }
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            if (recordedSessionCSV.length <= 1) return;
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([recordedSessionCSV.join("\n")], { type: 'text/csv;charset=utf-8;' }));
            link.download = `k9_6axis_${new Date().toISOString().slice(0,19).replace(/[:T]/g, "-")}.csv`;
            link.click();
        });

        document.getElementById('pdfBtn').addEventListener('click', () => {
            if (appState !== "REVIEW") return;
            const doc = new window.jspdf.jsPDF();
            doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text("K9MATICS PRO - 6-Axis Bericht", 14, 20);
            doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.text(`Datum: ${new Date().toLocaleString()}`, 14, 28);
            doc.setDrawColor(200, 200, 200); doc.line(14, 33, 196, 33);
            doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.text("Messwerte:", 14, 43);
            doc.setFont("helvetica", "normal"); doc.setFontSize(11);
            doc.text(`Asymmetrie: ${document.getElementById('valAsym').innerText}`, 14, 52);
            doc.text(`Mittlere Stoßkraft: ${document.getElementById('valImpact').innerText}`, 14, 60);
            doc.text(`Schritte: ${document.getElementById('valSteps').innerText}`, 14, 68);
            doc.addImage(mainChart.toBase64Image(), 'PNG', 14, 78, 182, 90);
            doc.save(`k9_6axis_bericht_${new Date().toISOString().slice(0,19).replace(/[:T]/g, "-")}.pdf`);
        });

        document.getElementById('connectBtn').addEventListener('click', connectBluetooth);
    </script>
</body>
</html>
