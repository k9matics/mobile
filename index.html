<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>K9matics Pro 3D v4.1</title>
    <!-- Externe Bibliotheken -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OBJ Loader für deinen echten 3D-Hund -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
    
    <style>
        :root { 
            --bg: #090c10; 
            --neon-cyan: #00ffcc; 
            --neon-pink: #ff0055; 
            --neon-yellow: #ffcc00; 
            --text: #c9d1d9; 
        }
        body { margin: 0; padding: 0; background: radial-gradient(circle at top, #161b22, var(--bg)); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 12px 20px; background: rgba(22, 27, 34, 0.4); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); gap: 8px; z-index: 10; }
        h1 { margin: 0; font-size: 1.1rem; color: #fff; letter-spacing: 1px; flex-grow: 1; text-shadow: 0 0 10px rgba(0, 255, 204, 0.3); }
        .version { font-size: 0.7em; color: var(--neon-pink); vertical-align: super; }
        .btn { background-color: var(--neon-cyan); color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap; box-shadow: 0 0 10px rgba(0,255,204,0.2); transition: all 0.3s ease; }
        .btn:active { transform: scale(0.95); }
        .btn-calib { background-color: rgba(137, 87, 229, 0.8); color: #fff; box-shadow: 0 0 10px rgba(137, 87, 229, 0.3); backdrop-filter: blur(5px); }
        .controls { display: flex; gap: 8px; padding: 12px 20px 0 20px; }
        .btn-measure { background-color: #238636; color: #fff; flex: 1.2; font-size: 0.9rem; padding: 10px; border-radius: 8px; border: none; font-weight: bold; }
        .btn-measure.active { background-color: var(--neon-pink); box-shadow: 0 0 15px rgba(255, 0, 85, 0.5); animation: pulse 1.5s infinite; }
        .btn-measure.review { background-color: #d29922; }
        .btn-action { background-color: rgba(48, 54, 61, 0.6); color: #8b949e; flex: 1; pointer-events: none; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); font-weight: bold; font-size: 0.85rem; }
        .btn-action.ready { background-color: #1f6beb; color: #fff; pointer-events: auto; box-shadow: 0 0 10px rgba(31,107,235,0.4); }
        .btn-action.pdf-ready { background-color: #8957e5; color: #fff; pointer-events: auto; box-shadow: 0 0 10px rgba(137,87,229,0.4); }
        @keyframes pulse { 0% { box-shadow: 0 0 5px rgba(255, 0, 85, 0.4); } 50% { box-shadow: 0 0 20px rgba(255, 0, 85, 0.8); } 100% { box-shadow: 0 0 5px rgba(255, 0, 85, 0.4); } }
        
        .dashboard { padding: 12px 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .gait-badge { align-self: center; background: rgba(33, 38, 45, 0.6); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1); padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; color: var(--neon-yellow); margin-bottom: 10px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        .kpi-container { display: flex; gap: 10px; margin-bottom: 10px; }
        .glass-box { background: rgba(22, 27, 34, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); padding: 10px; border-radius: 12px; flex: 1; text-align: center; transition: all 0.3s ease; }
        .kpi-title { font-size: 0.7rem; color: #8b949e; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .kpi-value { font-size: 1.4rem; font-weight: bold; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,255,204,0.3); transition: color 0.3s ease; }
        
        #model3D-container { width: 100%; height: 180px; background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
        #debugRaw { font-size: 0.65rem; color: rgba(139, 148, 158, 0.5); text-align: center; margin: 6px 0 10px 0; font-family: monospace; }
        
        .chart-container { flex-grow: 1; position: relative; width: 100%; min-height: 120px; }
        .gait-distribution { display: none; height: 8px; width: 100%; border-radius: 4px; margin-top: 10px; overflow: hidden; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .gait-distribution.show { display: flex; }
        .gait-segment { height: 100%; }
        .gait-schritt { background-color: #3fb950; }
        .gait-trab { background-color: var(--neon-yellow); }
        .gait-galopp { background-color: var(--neon-pink); }
        .gait-ruhe { background-color: #30363d; }
    </style>
</head>
<body>

    <header>
        <h1>K9MATICS <span class="version">PRO v4.1</span></h1>
        <button id="calibrateBtn" class="btn btn-calib">Nullpunkt</button>
        <button id="connectBtn" class="btn">Connect</button>
    </header>

    <div class="controls">
        <button id="measureBtn" class="btn btn-measure">Starten</button>
        <button id="exportBtn" class="btn btn-action">CSV</button>
        <button id="pdfBtn" class="btn btn-action">PDF</button>
    </div>

    <div class="dashboard">
        <div class="gait-badge" id="gaitStatus">Status: Nicht verbunden</div>
        
        <div class="kpi-container">
            <div class="glass-box">
                <div class="kpi-title">Asymmetrie</div>
                <div class="kpi-value" id="valAsym">-- %</div>
            </div>
            <div class="glass-box">
                <div class="kpi-title">Stoßkraft</div>
                <div class="kpi-value" id="valImpact" style="color: var(--neon-pink); text-shadow: 0 0 10px rgba(255,0,85,0.3);">-- G</div>
            </div>
            <div class="glass-box">
                <div class="kpi-title">Schritte</div>
                <div class="kpi-value" id="valSteps" style="color: var(--neon-yellow); text-shadow: 0 0 10px rgba(255,204,0,0.3);">0</div>
            </div>
        </div>

        <div id="model3D-container"></div>
        <div id="debugRaw">Warte auf Sensordaten...</div>

        <div class="chart-container">
            <canvas id="mainChart"></canvas>
            <div id="gaitDist" class="gait-distribution"></div>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
        
        let bleDevice;
        const LIVE_BUFFER_SIZE = 100;
        
        let magData = Array(LIVE_BUFFER_SIZE).fill(0);
        let xData = Array(LIVE_BUFFER_SIZE).fill(0);
        let yData = Array(LIVE_BUFFER_SIZE).fill(0);
        let zData = Array(LIVE_BUFFER_SIZE).fill(0);
        let timeData = Array.from({length: LIVE_BUFFER_SIZE}, (_, i) => i);
        let buffer = "";

        let lastX = 0, lastY = 0, lastZ = -1.0;
        let appState = "IDLE"; 
        let recordedMags = [], recordedX = [], recordedY = [], recordedZ = [], recordedGaits = [], recordedSessionCSV = [];
        let recordStartTime = 0;
        let activeGait = "Ruhe";
        let pitchOffset = 0, rollOffset = 0, yawOffset = 0;

        // --- 3D SETUP ---
        const container3D = document.getElementById('model3D-container');
        const scene = new THREE.Scene();
        
        // Holografisches Bodenraster hinzufügen
        const gridHelper = new THREE.GridHelper(10, 20, 0x00ffcc, 0x30363d);
        gridHelper.position.y = -1.2;
        scene.add(gridHelper);

        const camera = new THREE.PerspectiveCamera(45, container3D.clientWidth / container3D.clientHeight, 0.1, 100);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(container3D.clientWidth, container3D.clientHeight);
        container3D.appendChild(renderer.domElement);

        // Beleuchtung
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const sensor3D = new THREE.Group(); 
        scene.add(sensor3D);

        // ECHTES 3D-MODELL LADEN (Der Canaan Dog .obj)
        const loader = new THREE.OBJLoader();
        loader.load('13466_Canaan_Dog_v1_L3.obj', function (object) {
            
            // Dem Hund das "Hologramm"-Design geben
            object.traverse(function (child) {
                if (child.isMesh) {
                    child.material = new THREE.MeshPhysicalMaterial({ 
                        color: 0x00ffcc, 
                        transparent: true, 
                        opacity: 0.7,
                        wireframe: true // Macht ihn zu einem Neon-Gitternetz
                    });
                }
            });

            // Skalierung und Position anpassen
            object.scale.set(0.05, 0.05, 0.05); 
            object.position.set(0, -1.2, 0); // Leicht nach unten schieben
            
            sensor3D.add(object);
        });

        camera.position.set(3.5, 2.5, 4.5);
        camera.lookAt(0, -0.2, 0);

        let filterPitch = 0, filterRoll = 0, filterYaw = 0;
        let lastFilterTime = Date.now();

        function update3DModel(aX, aY, aZ, gX, gY, gZ) {
            const now = Date.now();
            const dt = (now - lastFilterTime) / 1000.0;
            lastFilterTime = now;

            const gxRad = gX * (Math.PI / 180);
            const gyRad = gY * (Math.PI / 180);
            const gzRad = gZ * (Math.PI / 180);

            const accRoll = Math.atan2(aY, Math.sqrt(aX*aX + aZ*aZ));
            const accPitch = Math.atan2(-aX, Math.sqrt(aY*aY + aZ*aZ));

            filterRoll = 0.96 * (filterRoll + gxRad * dt) + 0.04 * accRoll;
            filterPitch = 0.96 * (filterPitch + gyRad * dt) + 0.04 * accPitch;
            filterYaw += gzRad * dt; 

            // Kalibrierung anwenden
            sensor3D.rotation.set(filterPitch - pitchOffset, filterYaw - yawOffset, filterRoll - rollOffset);
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container3D.clientWidth / container3D.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container3D.clientWidth, container3D.clientHeight);
            renderer.render(scene, camera);
        });
        renderer.render(scene, camera);

        // --- CALIBRATION ---
        document.getElementById('calibrateBtn').addEventListener('click', () => {
            pitchOffset = filterPitch;
            rollOffset = filterRoll;
            yawOffset = filterYaw;
            document.getElementById('calibrateBtn').innerText = "OK ✓";
            setTimeout(() => document.getElementById('calibrateBtn').innerText = "Nullpunkt", 2000);
        });

        // --- CHART SETUP ---
        const ctx = document.getElementById('mainChart').getContext('2d');
        
        let gradientIdle = ctx.createLinearGradient(0, 0, 0, 150);
        gradientIdle.addColorStop(0, 'rgba(0, 255, 204, 0.4)');
        gradientIdle.addColorStop(1, 'rgba(0, 255, 204, 0.0)');

        let gradientMeas = ctx.createLinearGradient(0, 0, 0, 150);
        gradientMeas.addColorStop(0, 'rgba(255, 0, 85, 0.4)');
        gradientMeas.addColorStop(1, 'rgba(255, 0, 85, 0.0)');

        const mainChart = new Chart(ctx, {
            type: 'line',
            data: { 
                labels: timeData, 
                datasets: [
                    { label: 'Kraft', data: magData, borderColor: '#00ffcc', borderWidth: 2, pointRadius: 0, fill: true, backgroundColor: gradientIdle, tension: 0.2 },
                    { label: 'X', data: xData, borderColor: 'rgba(255,0,85,0.4)', borderWidth: 1, pointRadius: 0, tension: 0.1, fill: false },
                    { label: 'Y', data: yData, borderColor: 'rgba(63,185,80,0.4)', borderWidth: 1, pointRadius: 0, tension: 0.1, fill: false },
                    { label: 'Z', data: zData, borderColor: 'rgba(88,166,255,0.4)', borderWidth: 1, pointRadius: 0, tension: 0.1, fill: false }
                ] 
            },
            options: { 
                responsive: true, maintainAspectRatio: false, animation: false, 
                scales: { 
                    x: { display: false }, 
                    y: { suggestedMin: -1.5, suggestedMax: 2.5, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8b949e' } } 
                }, 
                plugins: { legend: { display: true, labels: { color: '#c9d1d9', boxWidth: 12 } } } 
            }
        });

        function findPeaks(data, height, distance) {
            let peaks = [];
            for (let i = 1; i < data.length - 1; i++) {
                if (data[i] > height && data[i] > data[i - 1] && data[i] > data[i + 1]) {
                    if (peaks.length === 0 || (i - peaks[peaks.length - 1].index) >= distance) { peaks.push({ index: i, value: data[i] }); }
                }
            }
            return peaks;
        }

        function detectGait(peaks, recentAvgMag) {
            if (recentAvgMag < 1.12 && peaks.length === 0) return "Ruhe";
            if (peaks.length === 0) return "Bewegung";
            const meanPeakVal = peaks.reduce((a, b) => a + b.value, 0) / peaks.length;
            if (meanPeakVal > 2.7) return "Galopp";
            if (meanPeakVal >= 1.3 && meanPeakVal <= 2.7) return "Trab";
            return "Schritt";
        }

        async function connectBluetooth() {
            try {
                const btn = document.getElementById('connectBtn');
                btn.innerText = "Suche...";
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: "K9matics" }, { services: [SERVICE_UUID] }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(CHAR_UUID);
                
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);
                
                btn.innerText = "Verbunden";
                btn.style.backgroundColor = "#ff0055"; btn.style.color = "#fff"; btn.style.boxShadow = "0 0 15px rgba(255,0,85,0.4)";
                document.getElementById('gaitStatus').innerText = "Status: Bereit";
                setInterval(updateDashboard, 100);
            } catch (error) {
                console.error(error);
                document.getElementById('connectBtn').innerText = "Connect";
            }
        }

        function handleData(event) {
            if (appState === "REVIEW") return;
            buffer += new TextDecoder().decode(event.target.value);
            let lines = buffer.split('\n');
            buffer = lines.pop(); 
            const now = Date.now();
            
            for (let line of lines) {
                line = line.trim();
                if(!line) continue;
                
                document.getElementById('debugRaw').innerText = "Raw: " + line;

                let ax = 0, ay = 0, az = 0, gx = 0, gy = 0, gz = 0;
                let dataFound = false;

                let mX = line.match(/(?:A?X):\s*([-\d\.]+)/i); if(mX) { ax = parseFloat(mX[1]); dataFound = true; }
                let mY = line.match(/(?:A?Y):\s*([-\d\.]+)/i); if(mY) { ay = parseFloat(mY[1]); dataFound = true; }
                let mZ = line.match(/(?:A?Z):\s*([-\d\.]+)/i); if(mZ) { az = parseFloat(mZ[1]); dataFound = true; }
                
                let mGX = line.match(/GX:\s*([-\d\.]+)/i); if(mGX) { gx = parseFloat(mGX[1]); }
                let mGY = line.match(/GY:\s*([-\d\.]+)/i); if(mGY) { gy = parseFloat(mGY[1]); }
                let mGZ = line.match(/GZ:\s*([-\d\.]+)/i); if(mGZ) { gz = parseFloat(mGZ[1]); }

                if (dataFound) {
                    if (az === 0 && Math.abs(lastZ) > 0.2) az = lastZ;
                    lastZ = az;

                    update3DModel(ax, ay, az, gx, gy, gz);
                    const mag = Math.sqrt(ax*ax + ay*ay + az*az);
                    
                    magData.push(mag); magData.shift();
                    xData.push(ax); xData.shift();
                    yData.push(ay); yData.shift();
                    zData.push(az); zData.shift();

                    if (appState === "MEASURING") {
                        const timestamp = ((now - recordStartTime) / 1000).toFixed(3);
                        recordedMags.push(mag);
                        recordedX.push(ax); recordedY.push(ay); recordedZ.push(az);
                        recordedGaits.push(activeGait);
                        recordedSessionCSV.push(`${timestamp},${ax},${ay},${az},${gx},${gy},${gz},${mag.toFixed(3)},${activeGait}`);
                    }
                }
            }
        }

        function updateDashboard() {
            if (appState === "REVIEW") return;
            
            mainChart.data.datasets[0].borderColor = appState === "MEASURING" ? '#ff0055' : '#00ffcc';
            mainChart.data.datasets[0].backgroundColor = appState === "MEASURING" ? gradientMeas : gradientIdle;
            mainChart.update();

            const recentData = magData.slice(-35); 
            const livePeaks = findPeaks(recentData, 1.25, 5); 
            const recentAvg = magData.slice(-10).reduce((a, b) => a + b, 0) / 10; 
            
            activeGait = detectGait(livePeaks, recentAvg);
            document.getElementById('gaitStatus').innerText = appState === "MEASURING" ? `🔴 Aufzeichnung... | ${activeGait}` : `Live: ${activeGait}`;

            if (appState === "MEASURING") {
                const allPeaks = findPeaks(recordedMags, 1.25, 7);
                document.getElementById('valSteps').innerText = allPeaks.length;
                if (allPeaks.length > 0) {
                    const peakVals = allPeaks.map(p => p.value);
                    const meanImpact = peakVals.reduce((a, b) => a + b, 0) / peakVals.length;
                    document.getElementById('valImpact').innerText = meanImpact.toFixed(2) + " G";
                    
                    if (peakVals.length >= 4) {
                        const lefts = peakVals.filter((_, i) => i % 2 === 0), rights = peakVals.filter((_, i) => i % 2 !== 0);
                        if (lefts.length > 0 && rights.length > 0) {
                            const meanL = lefts.reduce((a, b) => a + b, 0) / lefts.length, meanR = rights.reduce((a, b) => a + b, 0) / rights.length;
                            const asymCalc = (Math.abs(meanL - meanR) / ((meanL + meanR) / 2) * 100).toFixed(1);
                            
                            const asymEl = document.getElementById('valAsym');
                            asymEl.innerText = asymCalc + " %";
                            
                            if (parseFloat(asymCalc) > 15) {
                                asymEl.style.color = "var(--neon-pink)";
                                asymEl.style.textShadow = "0 0 10px rgba(255,0,85,0.4)";
                            } else {
                                asymEl.style.color = "var(--neon-cyan)";
                                asymEl.style.textShadow = "0 0 10px rgba(0,255,204,0.3)";
                            }
                        }
                    }
                }
            }
        }

        function showReview() {
            mainChart.data.labels = Array.from({length: recordedMags.length}, (_, i) => i);
            mainChart.data.datasets[0].data = recordedMags;
            mainChart.data.datasets[1].data = recordedX;
            mainChart.data.datasets[2].data = recordedY;
            mainChart.data.datasets[3].data = recordedZ;
            mainChart.data.datasets[0].borderColor = '#ffcc00';
            
            let gradientRev = ctx.createLinearGradient(0, 0, 0, 150);
            gradientRev.addColorStop(0, 'rgba(255, 204, 0, 0.4)');
            gradientRev.addColorStop(1, 'rgba(255, 204, 0, 0.0)');
            mainChart.data.datasets[0].backgroundColor = gradientRev;
            
            mainChart.options.scales.x.display = true;
            mainChart.update();
            
            let counts = { "Ruhe": 0, "Schritt": 0, "Trab": 0, "Galopp": 0, "Bewegung": 0 };
            recordedGaits.forEach(g => { if(counts[g] !== undefined) counts[g]++; });
            const total = recordedGaits.length || 1;
            const distDiv = document.getElementById('gaitDist');
            distDiv.innerHTML = '';
            const colors = { "Schritt": "gait-schritt", "Trab": "gait-trab", "Galopp": "gait-galopp", "Ruhe": "gait-ruhe", "Bewegung": "gait-ruhe" };
            for (const [gait, count] of Object.entries(counts)) {
                if (count > 0) {
                    const pct = (count / total) * 100;
                    const segment = document.createElement('div');
                    segment.className = `gait-segment ${colors[gait]}`;
                    segment.style.width = `${pct}%`;
                    segment.title = `${gait} (${pct.toFixed(0)}%)`;
                    distDiv.appendChild(segment);
                }
            }
            distDiv.classList.add('show');
            document.getElementById('gaitStatus').innerText = "Zusammenfassung der Messung";
        }

        document.getElementById('measureBtn').addEventListener('click', () => {
            const btn = document.getElementById('measureBtn'), exp = document.getElementById('exportBtn'), pdf = document.getElementById('pdfBtn');
            const distDiv = document.getElementById('gaitDist');
            if (appState === "IDLE") {
                appState = "MEASURING"; recordStartTime = Date.now();
                recordedSessionCSV = ["Time_Sec,AX,AY,AZ,GX,GY,GZ,Magnitude,Gangart"];
                recordedMags = []; recordedX = []; recordedY = []; recordedZ = []; recordedGaits = []; 
                distDiv.classList.remove('show');
                btn.innerText = "Stoppen"; btn.classList.add("active"); btn.classList.remove("review");
                exp.classList.remove("ready"); pdf.classList.remove("pdf-ready");
                document.getElementById('valAsym').innerText = "..."; document.getElementById('valImpact').innerText = "..."; document.getElementById('valSteps').innerText = "0";
                document.getElementById('valAsym').style.color = "var(--neon-cyan)";
            } else if (appState === "MEASURING") {
                appState = "REVIEW"; btn.innerText = "Neue Messung"; btn.classList.remove("active"); btn.classList.add("review");
                if (recordedSessionCSV.length > 1) { exp.classList.add("ready"); pdf.classList.add("pdf-ready"); showReview(); }
            } else if (appState === "REVIEW") {
                appState = "IDLE"; btn.innerText = "Starten"; btn.classList.remove("review");
                exp.classList.remove("ready"); pdf.classList.remove("pdf-ready"); distDiv.classList.remove('show');
                mainChart.data.labels = timeData; mainChart.data.datasets[0].data = magData; 
                mainChart.data.datasets[1].data = xData; mainChart.data.datasets[2].data = yData; mainChart.data.datasets[3].data = zData;
                mainChart.options.scales.x.display = false; mainChart.update();
                document.getElementById('valAsym').innerText = "-- %"; document.getElementById('valImpact').innerText = "-- G"; document.getElementById('valSteps').innerText = "0";
                document.getElementById('gaitStatus').innerText = "Status: Bereit";
            }
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            if (recordedSessionCSV.length <= 1) return;
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([recordedSessionCSV.join("\n")], { type: 'text/csv;charset=utf-8;' }));
            link.download = `k9_lauf_${new Date().toISOString().slice(0,19).replace(/[:T]/g, "-")}.csv`;
            link.click();
        });

        document.getElementById('pdfBtn').addEventListener('click', () => {
            if (appState !== "REVIEW") return;
            const doc = new window.jspdf.jsPDF();
